<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Manajemen Member - Arcell Komunika</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #e0e5ec;
            --shadow-light: #ffffff;
            --shadow-dark: #a3b1c6;
            --accent-color: #00a8ff;
            --text-main: #4d547d;
            --text-muted: #8893b0;
            --border-radius-md: 16px;
            --border-radius-pill: 50px;
            --bottom-nav-height: 65px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg-color); color: var(--text-main); padding-bottom: calc(var(--bottom-nav-height) + 20px); display: flex; justify-content: center; }
        .app-container { width: 100%; max-width: 480px; min-height: 100vh; background: var(--bg-color); padding: 16px; position: relative; }

        .page-header { font-size: 1.1rem; font-weight: 800; margin-bottom: 16px; display: flex; align-items: center; justify-content: space-between; }
        .page-header-title { display: flex; align-items: center; gap: 10px; }
        .page-header-title i { color: var(--accent-color); }

        /* --- CARD FORM REGISTRASI DOWNLINE --- */
        .register-card {
            background: var(--bg-color); padding: 16px; border-radius: var(--border-radius-md);
            box-shadow: 6px 6px 12px var(--shadow-dark), -6px -6px 12px var(--shadow-light); margin-bottom: 20px;
        }
        .card-title { font-size: 0.85rem; font-weight: 800; color: var(--text-main); margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
        .card-title i { color: var(--accent-color); }

        .form-group { margin-bottom: 10px; }
        .form-input {
            width: 100%; padding: 10px 14px; background: var(--bg-color); border: none; outline: none;
            border-radius: var(--border-radius-pill); font-size: 0.8rem; font-weight: 700; color: var(--text-main);
            box-shadow: inset 3px 3px 6px var(--shadow-dark), inset -3px -3px 6px var(--shadow-light);
        }
        .btn-submit {
            width: 100%; padding: 10px; border: none; outline: none; border-radius: var(--border-radius-pill);
            background: var(--accent-color); color: #fff; font-size: 0.8rem; font-weight: 800; cursor: pointer;
            box-shadow: 3px 3px 6px var(--shadow-dark), -3px -3px 6px var(--shadow-light); transition: all 0.2s ease;
        }
        .btn-submit:active { transform: scale(0.98); opacity: 0.9; }

        /* --- DAFTAR MEMBER --- */
        .member-list { display: flex; flex-direction: column; gap: 12px; }
        .member-card {
            background: var(--bg-color); padding: 14px 16px; border-radius: var(--border-radius-md);
            box-shadow: 4px 4px 8px var(--shadow-dark), -4px -4px 8px var(--shadow-light);
            display: flex; flex-direction: column; gap: 10px;
        }
        .member-info-top { display: flex; justify-content: space-between; align-items: center; }
        .member-name { font-size: 0.9rem; font-weight: 800; color: var(--text-main); display: flex; align-items: center; gap: 6px; }
        .member-badge { font-size: 0.65rem; background: rgba(0, 168, 255, 0.15); color: var(--accent-color); padding: 2px 8px; border-radius: 10px; font-weight: 800; }
        .member-balance { font-size: 0.85rem; font-weight: 800; color: #2ed573; }
        
        .member-actions { display: flex; gap: 8px; margin-top: 4px; }
        .btn-action-sm {
            flex: 1; padding: 6px; border: none; border-radius: var(--border-radius-pill); background: var(--bg-color);
            color: var(--text-main); font-size: 0.7rem; font-weight: 700; cursor: pointer;
            box-shadow: 3px 3px 6px var(--shadow-dark), -3px -3px 6px var(--shadow-light);
            display: flex; align-items: center; justify-content: center; gap: 5px;
        }
        .btn-action-sm i { color: var(--accent-color); }
        .btn-action-sm:active { box-shadow: inset 2px 2px 4px var(--shadow-dark), inset -2px -2px 4px var(--shadow-light); }

        /* --- MODAL POPUP RIWAYAT MEMBER --- */
        .modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.4);
            display: none; justify-content: center; align-items: center; z-index: 1000; padding: 16px;
        }
        .modal-overlay.show { display: flex; }
        .modal-box {
            width: 100%; max-width: 400px; background: var(--bg-color); border-radius: var(--border-radius-md);
            padding: 18px; box-shadow: 6px 6px 12px var(--shadow-dark), -6px -6px 12px var(--shadow-light);
            max-height: 80vh; overflow-y: auto;
        }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
        .modal-title { font-size: 0.95rem; font-weight: 800; }
        .modal-close { background: none; border: none; font-size: 1.2rem; font-weight: 800; color: var(--text-muted); cursor: pointer; }

        .tx-item { background: var(--bg-color); padding: 10px; border-radius: 10px; margin-bottom: 8px; box-shadow: inset 2px 2px 4px var(--shadow-dark), inset -2px -2px 4px var(--shadow-light); font-size: 0.75rem; }

        /* --- BOTTOM NAVIGATION BAR --- */
        .bottom-nav { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 480px; height: var(--bottom-nav-height); background: var(--bg-color); display: flex; justify-content: space-around; align-items: center; box-shadow: 0 -6px 12px var(--shadow-dark), 0 -2px 6px var(--shadow-light); z-index: 900; }
        .nav-item { display: flex; flex-direction: column; align-items: center; justify-content: center; text-decoration: none; color: var(--text-muted); width: 18%; height: 48px; border-radius: 10px; }
        .nav-item i { font-size: 1.15rem; margin-bottom: 3px; }
        .nav-item span { font-size: 0.65rem; font-weight: 700; }
        .nav-item.active { color: var(--accent-color); box-shadow: inset 3px 3px 6px var(--shadow-dark), inset -3px -3px 6px var(--shadow-light); }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="page-header">
            <div class="page-header-title"><i class="fa-solid fa-users"></i> Jaringan Member / Downline</div>
        </div>

        <!-- FORM DAFTARKAN DOWNLINE BARU -->
        <div class="register-card">
            <div class="card-title"><i class="fa-solid fa-user-plus"></i> Daftarkan Member Baru</div>
            <form id="formRegisterMember" onsubmit="handleRegisterMember(event)">
                <div class="form-group">
                    <input type="text" id="regNama" class="form-input" placeholder="Nama Lengkap Member" required>
                </div>
                <div class="form-group">
                    <input type="tel" id="regHp" class="form-input" placeholder="Nomor HP Member (e.g. 08123...)" required>
                </div>
                <div class="form-group">
                    <input type="number" id="regMarkup" class="form-input" placeholder="Markup Harga (Contoh: 500)" required>
                </div>
                <button type="submit" class="btn-submit"><i class="fa-solid fa-plus"></i> Daftarkan Sekarang</button>
            </form>
        </div>

        <!-- DAFTAR MEMBER SAYA -->
        <div class="card-title" style="margin-bottom: 10px;"><i class="fa-solid fa-list-ul"></i> Daftar Downline Saya</div>
        <div class="member-list" id="memberList">
            <!-- Render Member Cards via JS -->
        </div>

        <!-- BOTTOM NAV BAR -->
        <nav class="bottom-nav">
            <a href="index.html" class="nav-item"><i class="fa-solid fa-house"></i><span>Home</span></a>
            <a href="history.html" class="nav-item"><i class="fa-solid fa-clock-rotate-left"></i><span>History</span></a>
            <a href="rekap.html" class="nav-item"><i class="fa-solid fa-chart-line"></i><span>Rekap</span></a>
            <a href="member.html" class="nav-item active"><i class="fa-solid fa-users"></i><span>Member</span></a>
            <a href="akun.html" class="nav-item"><i class="fa-solid fa-user"></i><span>Akun</span></a>
        </nav>
    </div>

    <!-- MODAL DETAIL RIWAYAT TRANSAKSI MEMBER -->
    <div class="modal-overlay" id="modalHistory">
        <div class="modal-box">
            <div class="modal-header">
                <div class="modal-title" id="modalMemberTitle">Riwayat Transaksi</div>
                <button class="modal-close" onclick="closeModalHistory()">&times;</button>
            </div>
            <div id="modalHistoryContent">
                <!-- Content via JS -->
            </div>
        </div>
    </div>

    <script>
    // Fetch Daftar Member dari Server VPS
    async function renderMembers() {
        const container = document.getElementById('memberList');
        try {
            const response = await fetch('/api/member/list');
            const res = await response.json();
            const membersData = res.data || [];

            if (membersData.length === 0) {
                container.innerHTML = `<div style="text-align:center; padding:20px; color:var(--text-muted); font-size:0.8rem;">Belum ada member terdaftar.</div>`;
                return;
            }

            let html = '';
            membersData.forEach((m) => {
                const formatSaldo = new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(m.saldo);
                html += `
                    <div class="member-card">
                        <div class="member-info-top">
                            <div>
                                <div class="member-name"><i class="fa-solid fa-circle-user"></i> ${m.nama}</div>
                                <div style="font-size:0.7rem; color:var(--text-muted); margin-top:2px;">HP: ${m.hp} | Markup: Rp ${m.markup}</div>
                            </div>
                            <span class="member-badge">${m.id}</span>
                        </div>
                        <div style="display:flex; justify-content:space-between; align-items:center; margin-top:2px;">
                            <span style="font-size:0.7rem; color:var(--text-muted); font-weight:700;">Saldo Member:</span>
                            <span class="member-balance">${formatSaldo}</span>
                        </div>
                        <div class="member-actions">
                            <button class="btn-action-sm" onclick="tambahSaldoMember('${m.id}', '${m.nama}')"><i class="fa-solid fa-wallet"></i> Tambah Saldo</button>
                            <button class="btn-action-sm" onclick="openModalHistory('${m.nama}', '${m.id}')"><i class="fa-solid fa-receipt"></i> Riwayat Transaksi</button>
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;
        } catch (err) {
            container.innerHTML = `<div style="text-align:center; padding:20px; color:red; font-size:0.8rem;">Gagal memuat data member.</div>`;
        }
    }

    // Register Member Baru ke Database VPS
    async function handleRegisterMember(e) {
        e.preventDefault();
        const nama = document.getElementById('regNama').value.trim();
        const hp = document.getElementById('regHp').value.trim();
        const markup = parseInt(document.getElementById('regMarkup').value) || 0;

        try {
            const response = await fetch('/api/member/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ nama, hp, markup })
            });
            const res = await response.json();

            if (res.status === 'success') {
                alert(`Berhasil mendaftarkan member!\nID: ${res.data.id}\nNama: ${res.data.nama}`);
                document.getElementById('formRegisterMember').reset();
                renderMembers();
            } else {
                alert('Gagal: ' + res.message);
            }
        } catch (err) {
            alert('Terjadi kesalahan sistem.');
        }
    }

    // Topup Saldo Member ke Database VPS
    async function tambahSaldoMember(idMember, namaMember) {
        const inputNominal = prompt(`Masukkan nominal Tambah Saldo untuk ${namaMember}:`, "50000");
        if (inputNominal !== null) {
            const nominal = parseInt(inputNominal);
            if (!isNaN(nominal) && nominal > 0) {
                try {
                    const response = await fetch('/api/member/topup', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ id: idMember, nominal: nominal })
                    });
                    const res = await response.json();

                    if (res.status === 'success') {
                        alert(res.message);
                        renderMembers();
                    } else {
                        alert('Gagal: ' + res.message);
                    }
                } catch (err) {
                    alert('Gagal menambah saldo.');
                }
            } else {
                alert("Nominal saldo tidak valid.");
            }
        }
    }

    function openModalHistory(namaMember, idMember) {
        document.getElementById('modalMemberTitle').innerText = `Riwayat: ${namaMember}`;
        const content = document.getElementById('modalHistoryContent');
        content.innerHTML = `
            <div class="tx-item">
                <div style="display:flex; justify-content:space-between; font-weight:800; color:#2ed573;">
                    <span><i class="fa-solid fa-circle-check"></i> SUKSES</span>
                    <span>03.45 WIB</span>
                </div>
                <div style="margin-top:4px; font-weight:700;">TL5 - Telkomsel 5.000 (Tujuan: 08123991202)</div>
                <div style="color:var(--text-muted); font-size:0.65rem; margin-top:2px;">SN: 30812398129031203 | Status: Realtime</div>
            </div>
        `;
        document.getElementById('modalHistory').classList.add('show');
    }

    function closeModalHistory() {
        document.getElementById('modalHistory').classList.remove('show');
    }

    window.addEventListener('DOMContentLoaded', renderMembers);
</script>

</body>
</html>
