<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Produk Digiflazz - Arcell Komunika</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="manifest" href="/manifest-admin.json">
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 50%, #f1f5f9 100%);
            --glass-base: rgba(255, 255, 255, 0.55);
            --glass-card: rgba(255, 255, 255, 0.72);
            --glass-input: rgba(255, 255, 255, 0.85);
            --glass-border: rgba(255, 255, 255, 0.95);
            --glass-border-subtle: rgba(226, 232, 240, 0.6);
            --shadow-card: 0 4px 20px -2px rgba(100, 116, 139, 0.08), inset 0 1px 0 0 rgba(255, 255, 255, 0.9);
            --shadow-button: 0 4px 12px rgba(148, 163, 184, 0.2), inset 0 1px 0 rgba(255, 255, 255, 1);
            --text-main: #1e293b;
            --text-sub: #64748b;
            --primary: #4f46e5;
            --pink-accent: #db2777;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
        }

        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 0; }
        body { background: var(--bg-gradient); background-attachment: fixed; color: var(--text-main); padding-bottom: 40px; min-height: 100vh; }
        .header { background: var(--glass-base); backdrop-filter: blur(16px); padding: 16px 20px; text-align: center; border-bottom: 1px solid var(--glass-border); margin-bottom: 16px; position: sticky; top: 0; z-index: 100; display: flex; align-items: center; justify-content: center; }
        .header h2 { font-size: 1.2rem; color: var(--text-main); font-weight: 800; }

        .menu-btn { position: absolute; left: 16px; background: transparent; border: none; font-size: 1.25rem; color: var(--text-main); cursor: pointer; padding: 6px 10px; }
        .dropdown-menu { display: none; position: absolute; top: 55px; left: 16px; background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(20px); border: 1px solid var(--glass-border); border-radius: 16px; box-shadow: 0 10px 30px rgba(148, 163, 184, 0.25); width: 220px; z-index: 1000; flex-direction: column; padding: 6px 0; }
        .dropdown-menu.show { display: flex; }
        .dropdown-item { padding: 10px 16px; color: var(--text-main); text-decoration: none; font-size: 0.82rem; font-weight: 700; display: flex; align-items: center; gap: 10px; cursor: pointer; }
        .dropdown-item i { width: 18px; text-align: center; color: var(--primary); }
        .dropdown-divider { height: 1px; background: var(--glass-border-subtle); margin: 4px 0; }

        .container { max-width: 1000px; margin: 0 auto; padding: 0 12px; }
        .glass-card { background: var(--glass-card); backdrop-filter: blur(20px); border: 1px solid var(--glass-border); border-radius: 20px; padding: 16px; margin-bottom: 14px; box-shadow: var(--shadow-card); }

        h3 { margin-bottom: 12px; color: var(--primary); display: flex; align-items: center; gap: 8px; font-size: 0.95rem; font-weight: 800; }
        input, select { padding: 10px 14px; border-radius: 12px; border: 1px solid var(--glass-border-subtle); outline: none; font-size: 0.82rem; font-weight: 600; background: var(--glass-input); color: var(--text-main); width: 100%; }
        button { background: #ffffff; color: var(--primary); border: 1px solid var(--glass-border); padding: 9px 16px; border-radius: 12px; cursor: pointer; font-weight: 800; font-size: 0.8rem; box-shadow: var(--shadow-button); display: inline-flex; align-items: center; justify-content: center; gap: 6px; }

        .btn-success { color: #059669; }
        .btn-warning { color: #d97706; }
        .btn-danger { color: #dc2626; }
        .btn-sm { padding: 5px 10px; font-size: 0.72rem; border-radius: 9px; }

        .bulk-bar { display: flex; gap: 8px; flex-wrap: wrap; background: rgba(255, 255, 255, 0.5); padding: 10px; border-radius: 14px; margin-bottom: 12px; align-items: center; border: 1px solid var(--glass-border); }

        .folder-card { background: rgba(255, 255, 255, 0.7); border-radius: 16px; border: 1px solid var(--glass-border); margin-bottom: 10px; overflow: hidden; box-shadow: var(--shadow-card); }
        .folder-header { padding: 12px 14px; display: flex; align-items: center; justify-content: space-between; user-select: none; }
        .folder-left { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 0.85rem; color: var(--pink-accent); cursor: pointer; flex: 1; }
        .folder-icon { font-size: 1rem; color: var(--pink-accent); }
        .folder-right { display: flex; align-items: center; gap: 6px; }
        .badge-count { background: rgba(224, 231, 255, 0.8); color: var(--primary); padding: 3px 9px; border-radius: 12px; font-size: 0.68rem; font-weight: 800; }
        .folder-body { display: none; padding: 0 10px 10px 10px; flex-direction: column; gap: 6px; }
        .folder-card.open .folder-body { display: flex; }
        .folder-card.open .chevron { transform: rotate(180deg); }
        .chevron { transition: transform 0.2s; color: var(--text-sub); font-size: 0.75rem; cursor: pointer; }

        .prod-item { background: rgba(255, 255, 255, 0.95); padding: 9px 12px; border-radius: 12px; border: 1px solid var(--glass-border-subtle); display: flex; align-items: center; justify-content: space-between; }
        .prod-name { font-size: 0.8rem; font-weight: 800; color: var(--text-main); display: inline-flex; align-items: center; gap: 4px; }
        .prod-sku { font-size: 0.68rem; color: var(--text-sub); font-weight: 700; margin-top: 1px; }
        .prod-sku span { color: var(--primary); }
        .prod-price { font-size: 0.82rem; font-weight: 900; color: #059669; }

        .dot-indicator { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-left: 4px; vertical-align: middle; flex-shrink: 0; }
        .dot-digiflazz { background-color: #6366f1; }

        .status-badge { font-size: 0.62rem; font-weight: 800; padding: 2px 7px; border-radius: 6px; text-transform: uppercase; }
        .status-badge.active { background: rgba(16, 185, 129, 0.12); color: #059669; border: 1px solid rgba(16, 185, 129, 0.2); }
        .status-badge.hidden { background: rgba(239, 68, 68, 0.12); color: #dc2626; border: 1px solid rgba(239, 68, 68, 0.2); }
    </style>
</head>
<body>

    <div class="header">
        <button class="menu-btn" onclick="toggleDropdownMenu(event)"><i class="fa-solid fa-bars"></i></button>
        <h2>📦 Produk Digiflazz API</h2>

        <div class="dropdown-menu" id="dropdownMenu">
            <a href="#" class="dropdown-item" onclick="navTo('admin.html')">
                <i class="fa-solid fa-user-gear"></i> Dashboard & Member
            </a>
            <a href="#" class="dropdown-item" onclick="navTo('custom.html')">
                <i class="fa-solid fa-folder-tree"></i> Kategori Custom Produk
            </a>
            <a href="#" class="dropdown-item" onclick="navTo('okeconnect.html')">
                <i class="fa-solid fa-bolt"></i> Produk Okeconnect
            </a>
            <a href="#" class="dropdown-item" onclick="navTo('digiflazz.html')">
                <i class="fa-solid fa-box-open"></i> Produk Digiflazz
            </a>
            <div class="dropdown-divider"></div>
            <a href="#" class="dropdown-item" onclick="navTo('hutang.html')">
                <i class="fa-solid fa-book-bookmark"></i> Catatan Hutang
            </a>
            <a href="#" class="dropdown-item" onclick="navTo('kasir.html')">
                <i class="fa-solid fa-cash-register"></i> Kasir
            </a>
        </div>
    </div>

    <div class="container">
        <div class="glass-card">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
                <h3 style="margin:0;"><i class="fa-solid fa-layer-group"></i> Produk Digiflazz</h3>
                <button onclick="syncDigiflazzToDB()" class="btn-sm"><i class="fa-solid fa-rotate-right"></i> Sync API</button>
            </div>
            <div class="bulk-bar">
                <select id="bulkCategorySelectDigi" style="flex: 1; min-width: 140px;">
                    <option value="">-- Kategori Tujuan (DB) --</option>
                </select>
                <button onclick="pindahkanPilihanMassal()" class="btn-success btn-sm">
                    <i class="fa-solid fa-right-left"></i> Pindah ke DB (<span id="selectedCountDigi">0</span>)
                </button>
            </div>
            <input type="text" id="searchInput" placeholder="🔍 Cari SKU, Nama, Brand Digiflazz..." oninput="filterFoldersDigi()" style="width: 100%;">
        </div>

        <div id="folderContainer"></div>
    </div>

    <script>
        let rawData = [];
        let filteredData = [];
        let dbCustomCategories = [];
        let selectedSKUsDigi = new Set();

        function navTo(url) { window.location.replace(url); }
        function toggleDropdownMenu(evt) { evt.stopPropagation(); document.getElementById('dropdownMenu').classList.toggle('show'); }
        window.addEventListener('click', () => { const d = document.getElementById('dropdownMenu'); if (d && d.classList.contains('show')) d.classList.remove('show'); });

        async function loadCustomCategoriesFromDB() {
            try {
                const res = await fetch('/api/admin/custom-categories?t=' + Date.now());
                const result = await res.json();
                dbCustomCategories = Array.isArray(result) ? result : (result.data || []);
                let optionsHtml = '<option value="">-- Kategori Tujuan (DB) --</option>';
                dbCustomCategories.forEach(cat => optionsHtml += `<option value="${cat.id}">${cat.name} [${cat.brand}]</option>`);
                document.getElementById('bulkCategorySelectDigi').innerHTML = optionsHtml;
            } catch (err) {}
        }

        async function loadProduk() {
            try {
                const res = await fetch('/api/products?t=' + Date.now());
                const data = await res.json();
                rawData = Array.isArray(data) ? data : (data.data || []);
                filteredData = [...rawData];
                renderFolders();
            } catch (err) {}
        }

        async function syncDigiflazzToDB() {
            document.getElementById('folderContainer').innerHTML = `<div style="text-align:center; color: var(--primary); padding: 15px; font-size:0.8rem;"><i class="fa-solid fa-sync fa-spin"></i> Menyinkronkan data Digiflazz...</div>`;
            try {
                const res = await fetch('/api/digiflazz/price-list', { method: 'POST' });
                await res.json();
                await loadProduk();
            } catch (err) { loadProduk(); }
        }

        function toggleSelect(sku, checked) {
            if (checked) selectedSKUsDigi.add(sku); else selectedSKUsDigi.delete(sku);
            document.getElementById('selectedCountDigi').innerText = selectedSKUsDigi.size;
        }

        async function pindahkanPilihanMassal() {
            const categoryId = document.getElementById('bulkCategorySelectDigi').value;
            if(!categoryId) return alert('Pilih kategori tujuan DB!');
            if(selectedSKUsDigi.size === 0) return alert('Centang minimal 1 produk!');

            try {
                const res = await fetch('/api/admin/map-category-product-bulk', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ category_id: categoryId, skus: Array.from(selectedSKUsDigi), provider: 'digiflazz' })
                });
                const result = await res.json();
                if(result.status === 'success') { selectedSKUsDigi.clear(); document.getElementById('selectedCountDigi').innerText = 0; alert('Berhasil memindahkan produk ke Kategori Custom!'); } else alert('Gagal memetakan produk');
            } catch(e){ alert('Error jaringan'); }
        }

        function toggleFolder(el) {
            const card = el.closest('.folder-card');
            card.classList.toggle('open');
            const icon = card.querySelector('.folder-icon');
            if(icon) icon.className = card.classList.contains('open') ? 'fa-solid fa-folder-open folder-icon' : 'fa-solid fa-folder-closed folder-icon';
        }

        function renderFolders() {
            const container = document.getElementById("folderContainer");
            const grouped = {};
            filteredData.forEach(p => {
                const cat = p.type || p.category || 'Umum';
                if (!grouped[cat]) grouped[cat] = [];
                grouped[cat].push(p);
            });

            let html = '';
            Object.keys(grouped).forEach((catName) => {
                const prods = [...grouped[catName]].sort((a, b) => parseFloat(a.jual || a.price || 0) - parseFloat(b.jual || b.price || 0));

                html += `
                    <div class="folder-card">
                        <div class="folder-header" onclick="toggleFolder(this)">
                            <div class="folder-left"><i class="fa-solid fa-folder-closed folder-icon"></i><span>${catName}</span></div>
                            <div class="folder-right"><span class="badge-count">${prods.length} Produk</span><i class="fa-solid fa-chevron-down chevron"></i></div>
                        </div>
                        <div class="folder-body">
                `;
                prods.forEach(p => {
                    const sku = p.buyer_sku_code || p.sku || '-';
                    const price = parseFloat(p.jual || p.price || 0);
                    const isChecked = selectedSKUsDigi.has(sku) ? 'checked' : '';
                    const statusVal = p.status !== undefined ? String(p.status) : '1';
                    const isAktif = statusVal === '1' || statusVal.toLowerCase() === 'aktif';

                    html += `
                        <div class="prod-item">
                            <div style="display:flex; align-items:center; gap:8px;">
                                <input type="checkbox" value="${sku}" ${isChecked} onchange="toggleSelect('${sku}', this.checked)">
                                <div>
                                    <div class="prod-name">${p.product_name || p.nama_produk} <span class="dot-indicator dot-digiflazz"></span></div>
                                    <div class="prod-sku">SKU: <span>${sku}</span> | Brand: <b>${p.brand}</b></div>
                                </div>
                            </div>
                            <div style="text-align:right;">
                                <div class="prod-price">Rp ${price.toLocaleString('id-ID')}</div>
                                <span class="status-badge ${isAktif ? 'active' : 'hidden'}">${isAktif ? 'Tampil' : 'Sembunyi'}</span>
                            </div>
                        </div>`;
                });
                html += `</div></div>`;
            });
            container.innerHTML = html;
        }

        function filterFoldersDigi() {
            const kw = document.getElementById('searchInput').value.toLowerCase();
            filteredData = rawData.filter(p => String(p.buyer_sku_code || p.sku || '').toLowerCase().includes(kw) || String(p.product_name || p.nama_produk || '').toLowerCase().includes(kw));
            renderFolders();
        }

        window.onload = () => { loadCustomCategoriesFromDB(); loadProduk(); };
    </script>
</body>
</html>
