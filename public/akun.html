<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Akun & Profil - Arcell Komunika</title>
    <!-- FontAwesome & Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* --- CLEAN WHITE NEUMORPHISM THEME (SERASI DENGAN INDEX.HTML) --- */
        :root {
            --bg-base: #e6eaf0;
            --neu-light: #ffffff;
            --neu-dark: #babecc;
            --text-main: #4a5568;
            --text-muted: #8c98a9;
            --accent-purple: #7052ff;
            --border-radius-sm: 14px;
            --border-radius-md: 22px;
            --border-radius-pill: 50px;
            --bottom-nav-height: 70px;
            
            --neu-shadow-flat: 6px 6px 12px var(--neu-dark), -6px -6px 12px var(--neu-light);
            --neu-shadow-sm: 3px 3px 6px var(--neu-dark), -3px -3px 6px var(--neu-light);
            --neu-shadow-inset: inset 3px 3px 6px var(--neu-dark), inset -3px -3px 6px var(--neu-light);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px 16px calc(var(--bottom-nav-height) + 30px) 16px;
        }

        .app-container {
            width: 100%;
            max-width: 480px;
            margin: 0 auto;
        }

        .card-box {
            background: var(--bg-base);
            padding: 30px 24px;
            border-radius: var(--border-radius-md);
            box-shadow: var(--neu-shadow-flat);
            text-align: center;
            width: 100%;
        }

        h2 { color: var(--accent-purple); margin-bottom: 6px; font-weight: 800; font-size: 1.3rem; }
        p { color: var(--text-muted); font-size: 0.82rem; margin-bottom: 24px; font-weight: 600; }

        .input-group {
            background: var(--bg-base);
            border-radius: var(--border-radius-pill);
            padding: 12px 18px;
            box-shadow: var(--neu-shadow-inset);
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
        }
        .input-group i { color: var(--accent-purple); }
        .input-group input {
            border: none;
            background: transparent;
            outline: none;
            width: 100%;
            font-weight: 700;
            color: var(--text-main);
            font-size: 0.95rem;
        }

        .btn-action {
            background: var(--accent-purple);
            color: #ffffff;
            width: 100%;
            border: none;
            padding: 14px;
            border-radius: var(--border-radius-pill);
            font-weight: 800;
            font-size: 0.95rem;
            cursor: pointer;
            box-shadow: var(--neu-shadow-sm);
            margin-top: 10px;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .btn-action:active { box-shadow: var(--neu-shadow-inset); }
        .btn-danger { background: #dc3545; }

        .profile-info {
            background: var(--bg-base);
            border-radius: var(--border-radius-sm);
            padding: 18px;
            box-shadow: var(--neu-shadow-inset);
            margin-bottom: 20px;
            text-align: left;
        }
        .profile-row { display: flex; justify-content: space-between; margin-bottom: 12px; font-size: 0.85rem; }
        .profile-row:last-child { margin-bottom: 0; }
        .profile-label { color: var(--text-muted); font-weight: 600; }
        .profile-val { font-weight: 800; color: var(--text-main); }

        /* --- BOTTOM NAV NEUMORPHISM (EXACT MATCH INDEX.HTML) --- */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 480px;
            height: var(--bottom-nav-height);
            background: var(--bg-base);
            display: flex;
            justify-content: space-around;
            align-items: center;
            box-shadow: 0 -5px 15px rgba(0,0,0,0.05);
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
            padding: 0 10px;
            z-index: 999;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            color: var(--text-muted);
            font-size: 11px;
            font-weight: 600;
            width: 60px;
            height: 50px;
            border-radius: 14px;
            transition: all 0.3s ease;
            background: var(--bg-base);
            box-shadow: var(--neu-shadow-sm);
        }

        .nav-item i {
            font-size: 18px;
            margin-bottom: 3px;
        }

        .nav-item.active {
            color: var(--accent-purple);
            box-shadow: var(--neu-shadow-inset);
        }
    </style>
</head>
<body>

    <div class="app-container">

        <!-- KONDISI 1: TAMPILAN PROFIL & LOGOUT (BILA SUDAH LOGIN) -->
        <div class="card-box" id="viewProfile" style="display: none;">
            <h2>Profil Member</h2>
            <p>Informasi Akun Arcell Komunika Anda</p>

            <div style="font-size: 3.5rem; color: var(--accent-purple); margin-bottom: 15px;">
                <i class="fa-solid fa-circle-user"></i>
            </div>

            <div class="profile-info">
                <div class="profile-row">
                    <span class="profile-label">ID Member:</span>
                    <span class="profile-val" id="dispMemberId">-</span>
                </div>
                <div class="profile-row">
                    <span class="profile-label">Nama Member:</span>
                    <span class="profile-val" id="dispName">-</span>
                </div>
                <div class="profile-row">
                    <span class="profile-label">Nomor HP:</span>
                    <span class="profile-val" id="dispPhone">-</span>
                </div>
            </div>

            <button class="btn-action" onclick="window.location.href='index.html'" style="margin-bottom: 12px;">
                <i class="fa-solid fa-house"></i> Beranda
            </button>
            <button class="btn-action btn-danger" onclick="prosesLogout()">
                <i class="fa-solid fa-right-from-bracket"></i> Keluar (Logout)
            </button>
        </div>

        <!-- KONDISI 2: TAMPILAN FORM LOGIN (BILA BELUM LOGIN) -->
        <div class="card-box" id="viewLogin" style="display: none;">
            <h2>Arcell Komunika</h2>
            <p>Masukkan Nomor HP untuk masuk ke aplikasi</p>

            <div class="input-group">
                <i class="fa-solid fa-user"></i>
                <input type="text" id="loginName" placeholder="Nama Lengkap (Opsional)">
            </div>

            <div class="input-group">
                <i class="fa-solid fa-phone"></i>
                <input type="tel" id="loginPhone" placeholder="Nomor HP (misal: 08123456789)">
            </div>

            <button class="btn-action" onclick="prosesLogin()">
                <i class="fa-solid fa-right-to-bracket"></i> Masuk Sekarang
            </button>
        </div>

    </div>

    <!-- 📌 BOTTOM NAVIGATION BAR INTEGRATED -->
    <div class="bottom-nav">
        <a href="index.html" class="nav-item">
            <i class="fa-solid fa-house"></i>
            <span>Home</span>
        </a>
        <a href="history.html" class="nav-item">
            <i class="fa-solid fa-clock-rotate-left"></i>
            <span>History</span>
        </a>
        <a href="rekap.html" class="nav-item">
            <i class="fa-solid fa-chart-line"></i>
            <span>Rekap</span>
        </a>
	<a href="kasir.html" class="nav-item">
            <i class="fa-solid fa-cash-register"></i>
            <span>Kasir</span>
        <a href="akun.html" class="nav-item active">
            <i class="fa-solid fa-user"></i>
            <span>Akun</span>
        </a>
    </div>

    <script>
        window.onload = function() {
            const isLoggedIn = localStorage.getItem('isLoggedIn');

            if (isLoggedIn === 'true') {
                document.getElementById('viewProfile').style.display = 'block';
                document.getElementById('viewLogin').style.display = 'none';

                document.getElementById('dispName').innerText = localStorage.getItem('userName') || 'Member';
                document.getElementById('dispPhone').innerText = localStorage.getItem('userPhone') || '-';
                document.getElementById('dispMemberId').innerText = localStorage.getItem('memberId') || '-';
            } else {
                document.getElementById('viewProfile').style.display = 'none';
                document.getElementById('viewLogin').style.display = 'block';
            }
        };

        async function prosesLogin() {
            const name = document.getElementById('loginName').value.trim();
            const phone = document.getElementById('loginPhone').value.trim();

            if (!phone || phone.length < 8) {
                return alert('Masukkan Nomor HP yang valid!');
            }

            try {
                const res = await fetch('/api/member/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, phone })
                });

                const result = await res.json();

                if (result.status === 'success' && result.data) {
                    localStorage.setItem('isLoggedIn', 'true');
                    localStorage.setItem('userPhone', result.data.phone);
                    localStorage.setItem('userName', result.data.name);
                    localStorage.setItem('memberId', result.data.member_id);

                    alert('✅ Login Berhasil! Selamat datang, ' + result.data.name);
                    window.location.href = 'index.html';
                } else {
                    alert('❌ Gagal Login: ' + result.message);
                }
            } catch (err) {
                alert('❌ Gagal terhubung ke server VPS');
            }
        }

        function prosesLogout() {
            if (confirm('Apakah Anda yakin ingin keluar dari akun ini?')) {
                localStorage.clear();
                alert('✅ Anda telah berhasil logout!');
                window.location.reload();
            }
        }
    </script>
</body>
</html>
