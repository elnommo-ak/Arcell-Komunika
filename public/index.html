<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Arcell Komunika - App Shell</title>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="manifest" href="/manifest.json">

    <!-- 🔔 ONESIGNAL SDK v16 FINAL (FIXED) -->
    <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
    <script>
     window.OneSignalDeferred = window.OneSignalDeferred || [];
      OneSignalDeferred.push(async function(OneSignal) {
      // 1. Inisialisasi OneSignal
      await OneSignal.init({
      appId: "8370e207-3701-48a6-82d0-45d76f860691",
      safari_web_id: "web.onesignal.auto.19aac151-6a52-4f31-b603-0bf7908b06b4",
      notifyButton: {
        enable: false,
      },
    });

    // 2. HUBUNGKAN NO HP USER SEBAGAI EXTERNAL ID (Didalam async callback)
    const userPhone = localStorage.getItem('userPhone') || localStorage.getItem('memberId');
    if (userPhone) {
      await OneSignal.login(String(userPhone));
      console.log("✅ OneSignal External ID Synced:", userPhone);
    }
  });
</script>
    
    <!-- 🔒 PROTEKSI WAJIB LOGIN -->
    <script>
      (function() {
          const isLoggedIn = localStorage.getItem('isLoggedIn');
          if (isLoggedIn !== 'true') {
              window.location.href = 'akun.html';
          }
      })();
    </script>

    <style>
        /* --- CLEAN WHITE NEUMORPHISM THEME --- */
        :root {
            --bg-base: #e6eaf0;
            --neu-light: #ffffff;
            --neu-dark: #babecc;
            --text-main: #4a5568;
            --text-muted: #8c98a9;
            --accent-purple: #7052ff;
            --bottom-nav-height: 70px;
            
            /* Clean Neumorphism Shadows */
            --neu-shadow-sm: 3px 3px 6px var(--neu-dark), -3px -3px 6px var(--neu-light);
            --neu-shadow-inset: inset 3px 3px 6px var(--neu-dark), inset -3px -3px 6px var(--neu-light);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
            background-color: var(--bg-base);
            color: var(--text-main);
            overflow: hidden;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .app-container {
            width: 100%;
            max-width: 480px;
            height: 100vh;
            background-color: var(--bg-base);
            position: relative;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
        }

        /* --- FRAME CONTENT CONTAINER --- */
        .content-frame {
            width: 100%;
            height: calc(100vh - var(--bottom-nav-height));
            border: none;
            outline: none;
            background: transparent;
        }

        /* --- BOTTOM NAV NEUMORPHISM --- */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 480px;
            height: var(--bottom-nav-height);
            background: var(--bg-base);
            display: flex;
            justify-content: space-around;
            align-items: center;
            box-shadow: 0 -5px 15px rgba(0,0,0,0.05);
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
            padding: 0 10px;
            z-index: 999;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            color: var(--text-muted);
            font-size: 11px;
            font-weight: 600;
            width: 60px;
            height: 50px;
            border-radius: 14px;
            transition: all 0.3s ease;
            background: var(--bg-base);
            box-shadow: var(--neu-shadow-sm);
        }

        .nav-item i {
            font-size: 18px;
            margin-bottom: 3px;
        }

        .nav-item.active {
            color: var(--accent-purple);
            box-shadow: var(--neu-shadow-inset);
        }
    </style>
</head>
<body>

    <div class="app-container" id="app-canvas">

        <!-- FRAME TEMPAT MEMUAT HALAMAN DINAMIS -->
        <iframe id="main-frame" class="content-frame" src="home.html"></iframe>

        <!-- 📌 BOTTOM NAVIGATION BAR INTEGRATED (SMART ROUTING) -->
        <div class="bottom-nav">
            <a href="javascript:void(0)" onclick="navigateReplace('home.html', this)" class="nav-item active">
                <i class="fa-solid fa-house"></i>
                <span>Home</span>
            </a>
            <a href="javascript:void(0)" onclick="navigateReplace('history.html', this)" class="nav-item">
                <i class="fa-solid fa-clock-rotate-left"></i>
                <span>History</span>
            </a>
            <a href="javascript:void(0)" onclick="navigateReplace('rekap.html', this)" class="nav-item">
                <i class="fa-solid fa-chart-line"></i>
                <span>Rekap</span>
            </a>
            <a href="javascript:void(0)" onclick="navigateReplace('kasir.html', this)" class="nav-item">
                <i class="fa-solid fa-cash-register"></i>
                <span>Kasir</span>
            </a>
            <a href="javascript:void(0)" onclick="navigateReplace('akun.html', this)" class="nav-item">
                <i class="fa-solid fa-user"></i>
                <span>Akun</span>
            </a>
        </div>

    </div>

    <!-- SMART ROUTING JAVASCRIPT -->
    <script>
    // 1. Dapatkan halaman terakhir dari localStorage, jika tidak ada gunakan 'home.html'
    const lastPage = localStorage.getItem('activeTab') || 'home.html';

    window.addEventListener('DOMContentLoaded', () => {
        const mainFrame = document.getElementById('main-frame');
        
        // Memuat halaman terakhir yang tersimpan saat aplikasi dibuka
        if (mainFrame) {
            mainFrame.src = lastPage;
        }

        // Menyesuaikan tampilan tombol active di bottom nav sesuai lastPage
        const activeLink = document.querySelector(`.bottom-nav a[onclick*="${lastPage}"]`);
        if (activeLink) {
            document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
            activeLink.classList.add('active');
        }
    });

    // 2. Fungsi navigasi dengan menyimpan halaman aktif & tanpa merusak history
    function navigateReplace(pageUrl, element) {
        if (window.event) window.event.preventDefault();

        // Simpan halaman yang dipilih ke localStorage
        localStorage.setItem('activeTab', pageUrl);

        // Ganti halaman iframe tanpa menambah riwayat browser
        const mainFrame = document.getElementById('main-frame');
        if (mainFrame && mainFrame.contentWindow) {
            mainFrame.contentWindow.location.replace(pageUrl);
        }

        // Update tombol active pada bottom nav
        if (element) {
            const navItems = document.querySelectorAll('.nav-item');
            navItems.forEach(item => item.classList.remove('active'));
            element.classList.add('active');
        }
    }
    </script>
</body>
</html>
