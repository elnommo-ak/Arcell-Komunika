<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Arcell Komunika - PPOB Digiflazz</title>
    <!-- FontAwesome untuk Ikon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* --- CONFIGURATION & BASE STYLE --- */
        :root {
            --bg-color: #e0e5ec;
            --shadow-light: #ffffff;
            --shadow-dark: #a3b1c6;
            --accent-color: #00a8ff;
            --text-main: #4d547d;
            --text-muted: #8893b0;
            --border-radius-sm: 10px;
            --border-radius-md: 16px;
            --border-radius-pill: 50px;
            --main-gap: 12px;
        }

        * {
            margin: 0; padding: 0; box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        html, body { width: 100%; height: 100%; background-color: var(--bg-color); color: var(--text-main); }
        body { display: flex; justify-content: center; align-items: flex-start; overflow-x: hidden; overflow-y: auto; padding-bottom: 90px; }

        .app-container { width: 100%; max-width: 480px; min-height: 100vh; background-color: var(--bg-color); position: relative; margin: 0 auto; }

        ::-webkit-scrollbar { display: none !important; width: 0 !important; height: 0 !important; }
        * { -ms-overflow-style: none !important; scrollbar-width: none !important; }

        /* --- STICKY HEADER SECTION --- */
        .header { position: sticky; top: 0; z-index: 100; padding: 16px; background: var(--bg-color); }
        .header-top { display: flex; justify-content: space-between; align-items: center; }
        .user-profile { display: flex; align-items: center; gap: 12px; }
        .profile-img {
            width: 42px; height: 42px; border-radius: 50%; background-color: var(--bg-color); 
            box-shadow: 4px 4px 8px var(--shadow-dark), -4px -4px 8px var(--shadow-light); object-fit: cover; padding: 2px;
        }
        .user-info .greeting { font-size: 0.72rem; color: var(--text-muted); font-weight: 600; }
        .user-info .username { font-size: 0.95rem; font-weight: 800; color: var(--text-main); }

        .menu-toggle-btn {
            width: 40px; height: 40px; display: flex; align-items: center; justify-content: center;
            background: var(--bg-color); border-radius: 50%; color: var(--text-main);
            box-shadow: 4px 4px 8px var(--shadow-dark), -4px -4px 8px var(--shadow-light); border: none; cursor: pointer;
        }

        /* --- SIDEBAR MENU --- */
        .sidebar-overlay { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.3); display: none; z-index: 998; }
        .sidebar-overlay.show { display: block; }
        .sidebar {
            position: fixed; top: 0; left: -280px; width: 280px; height: 100%;
            background: var(--bg-color); z-index: 999; box-shadow: 10px 0 20px rgba(0,0,0,0.05);
            transition: left 0.3s ease; display: flex; flex-direction: column; padding: 24px;
        }
        .sidebar.show { left: 0; }
        .sidebar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
        .sidebar-title { font-size: 1rem; font-weight: 800; color: var(--text-main); display: flex; align-items: center; gap: 10px; }
        .sidebar-close { border: none; background: transparent; font-size: 1.5rem; color: var(--text-muted); cursor: pointer; }
        .sidebar-menu-list { display: flex; flex-direction: column; gap: 14px; }
        .sidebar-item {
            display: flex; align-items: center; gap: 14px; padding: 12px 18px; background: var(--bg-color);
            border-radius: var(--border-radius-md); text-decoration: none; color: var(--text-main); font-size: 0.85rem; font-weight: 700;
            box-shadow: 4px 4px 8px var(--shadow-dark), -4px -4px 8px var(--shadow-light);
        }

        /* --- SALDO UTAMA --- */
        .wallet-section {
            margin: 10px 16px var(--main-gap) 16px; padding: 16px 20px; background: var(--bg-color); 
            border-radius: var(--border-radius-md); box-shadow: 6px 6px 12px var(--shadow-dark), -6px -6px 12px var(--shadow-light); 
            display: flex; align-items: center; justify-content: space-between;
        }
        .wallet-label { font-size: 0.7rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; display: flex; align-items: center; gap: 6px; }
        .balance { font-weight: 800; font-size: 1.4rem; color: var(--text-main); margin-top: 6px; }

        .wallet-actions-card {
            margin: 0 16px var(--main-gap) 16px; padding: 8px 12px; background: var(--bg-color);
            border-radius: var(--border-radius-md); box-shadow: 6px 6px 12px var(--shadow-dark), -6px -6px 12px var(--shadow-light);
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px;
        }
        .action-btn {
            display: flex; align-items: center; justify-content: center; gap: 6px; padding: 6px 4px;
            background: var(--bg-color); border-radius: var(--border-radius-pill);
            box-shadow: 3px 3px 6px var(--shadow-dark), -3px -3px 6px var(--shadow-light);
            text-decoration: none; color: var(--text-main); font-size: 0.7rem; font-weight: 700;
        }

        /* --- RUNNING TEXT --- */
        .ticker-container { 
            margin: 0 16px var(--main-gap) 16px; display: flex; align-items: center; background: var(--bg-color); 
            border-radius: var(--border-radius-pill); padding: 6px 14px; border: 2px solid var(--accent-color);
            box-shadow: inset 3px 3px 6px var(--shadow-dark), inset -3px -3px 6px var(--shadow-light); 
        }
        .ticker-icon { color: var(--accent-color); margin-right: 10px; }
        .ticker-content { flex: 1; overflow: hidden; }
        .ticker-content marquee { font-size: 0.72rem; font-weight: 600; color: var(--text-muted); }

        /* --- DIVIDER --- */
        .section-divider { display: flex; align-items: center; justify-content: center; margin: var(--main-gap) 16px; }
        .divider-line { flex: 1; height: 2px; background: var(--shadow-dark); opacity: 0.5; }
        .divider-badge {
            padding: 6px 16px; font-size: 0.7rem; font-weight: 800; color: var(--accent-color); background: var(--bg-color);
            border-radius: var(--border-radius-pill); box-shadow: 3px 3px 6px var(--shadow-dark), -3px -3px 6px var(--shadow-light); margin: 0 10px;
        }

        /* --- CARD WRAPPER & INPUT POPUP --- */
        .card-wrapper { position: relative; z-index: 101; background-color: var(--bg-color); padding: 0 16px; }
        .popup-top-container {
            display: none; max-height: 280px; overflow-y: auto; margin-bottom: var(--main-gap); padding: 14px;
            background: var(--bg-color); border-radius: var(--border-radius-md);
            box-shadow: inset 4px 4px 8px var(--shadow-dark), inset -4px -4px 8px var(--shadow-light);
        }

        .inset-tabs-wrapper { display: none; overflow-x: auto; white-space: nowrap; gap: 10px; padding-bottom: 8px; margin-bottom: 8px; }
        .tab-item-inset {
            display: inline-flex; padding: 6px 16px; border-radius: var(--border-radius-pill); border: none; background: var(--bg-color);
            color: var(--text-muted); font-size: 0.7rem; font-weight: 700; cursor: pointer;
            box-shadow: 3px 3px 6px var(--shadow-dark), -3px -3px 6px var(--shadow-light);
        }
        .tab-item-inset.active { color: var(--accent-color); box-shadow: inset 3px 3px 5px var(--shadow-dark), inset -3px -3px 5px var(--shadow-light); }

        .input-box {
            display: flex; align-items: center; padding: 8px 14px; gap: 10px; 
            background: var(--bg-color); border-radius: var(--border-radius-pill); border: 2px solid var(--accent-color);
            box-shadow: inset 3px 3px 6px var(--shadow-dark), inset -3px -3px 6px var(--shadow-light);
        }
        .input-box input { flex: 1; border: none; background: transparent; outline: none; font-size: 1rem; font-weight: 700; color: var(--text-main); }
        .operator-badge {
            background-color: var(--bg-color); color: var(--accent-color); padding: 3px 10px; border-radius: var(--border-radius-pill);
            font-size: 0.65rem; font-weight: 800; display: none; box-shadow: 2px 2px 4px var(--shadow-dark), -2px -2px 4px var(--shadow-light);
        }

        .product-list { display: flex; flex-direction: column; gap: 10px; }
        .product-card {
            background: var(--bg-color); border-radius: var(--border-radius-sm); padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; cursor: pointer;
            box-shadow: 4px 4px 8px var(--shadow-dark), -4px -4px 8px var(--shadow-light);
        }
        .product-title { font-size: 0.78rem; font-weight: 700; color: var(--text-main); }
        .product-price { font-size: 0.85rem; font-weight: 800; color: var(--accent-color); }

        /* --- MENU UTAMA --- */
        .purchase-container {
            margin: 0 16px var(--main-gap) 16px; padding: 20px 16px; background: var(--bg-color); border-radius: var(--border-radius-md);
            box-shadow: 6px 6px 12px var(--shadow-dark), -6px -6px 12px var(--shadow-light);
        }
        .menu-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px 12px; }
        .grid-item { display: flex; flex-direction: column; align-items: center; text-align: center; cursor: pointer; }
        .icon-wrapper {
            width: 52px; height: 52px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
            margin-bottom: 8px; font-size: 1.25rem; background: var(--bg-color); 
            box-shadow: 4px 4px 8px var(--shadow-dark), -4px -4px 8px var(--shadow-light); color: var(--accent-color);
        }
        .grid-item span { font-size: 0.7rem; font-weight: 700; color: var(--text-main); }

        /* --- BOTTOM NAV --- */
        .bottom-nav {
            position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 480px; height: 68px;
            background: var(--bg-color); box-shadow: 0 -6px 16px var(--shadow-dark), 0 -2px 8px var(--shadow-light);
            display: flex; align-items: center; justify-content: space-around; z-index: 900; border-radius: 20px 20px 0 0;
        }
        .nav-item { display: flex; flex-direction: column; align-items: center; text-decoration: none; color: var(--text-muted); font-size: 0.65rem; font-weight: 700; }
        .nav-item.active { color: var(--accent-color); }
        .nav-item i { font-size: 1.2rem; margin-bottom: 2px; }
    </style>
</head>
<body>

    <div class="app-container">

        <!-- Sidebar Overlay & Menu -->
        <div class="sidebar-overlay" id="sidebar-overlay"></div>
        <div class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-title"><i class="fa-solid fa-bars-staggered"></i> Menu Lainnya</div>
                <button class="sidebar-close" id="sidebar-close">&times;</button>
            </div>
            <div class="sidebar-menu-list">
                <a href="/riwayat" class="sidebar-item"><i class="fa-solid fa-clock-rotate-left"></i> Riwayat Transaksi</a>
                <a href="/member" class="sidebar-item"><i class="fa-solid fa-user"></i> Pengaturan Akun</a>
            </div>
        </div>

        <!-- Header -->
        <div class="header">
            <div class="header-top">
                <div class="user-profile">
                    <img src="https://images.bukaolshop.com/hosting/180774/3b0c09d4696e527913.png" class="profile-img" alt="Logo">
                    <div class="user-info">
                        <div class="greeting" id="time-greeting">Selamat Datang,</div>
                        <div class="username">Sahabat Arcell</div>
                    </div>
                </div>
                <button class="menu-toggle-btn" id="menu-toggle"><i class="fa-solid fa-bars"></i></button>
            </div>
        </div>

        <!-- Saldo -->
        <div class="wallet-section">
            <div class="wallet-info">
                <span class="wallet-label"><i class="fa-solid fa-wallet"></i> Saldo Anda</span>
                <div class="balance" id="user-balance">Rp 0</div>
            </div>
        </div>

        <div class="wallet-actions-card">
            <a href="#" class="action-btn" onclick="alert('Fitur Isi Saldo siap diintegrasikan')"><i class="fa-solid fa-circle-plus"></i> Isi Saldo</a>
            <a href="#" class="action-btn" onclick="alert('Fitur Kirim Saldo')"><i class="fa-solid fa-paper-plane"></i> Kirim</a>
            <a href="/riwayat" class="action-btn"><i class="fa-solid fa-clock-rotate-left"></i> Riwayat</a>
        </div>

        <!-- Ticker -->
        <div class="ticker-container">
            <div class="ticker-icon"><i class="fa-solid fa-bullhorn"></i></div>
            <div class="ticker-content">
                <marquee direction="left" scrollamount="4">⚡ Server VPS Digiflazz Arcell Komunika Online 24 Jam Nonstop!</marquee>
            </div>
        </div>

        <div class="section-divider">
            <div class="divider-line"></div>
            <div class="divider-badge"><i class="fa-solid fa-bolt"></i> Transaksi Cepat</div>
            <div class="divider-line"></div>
        </div>

        <!-- INPUT HP & POPUP PRODUK DIGIFLAZZ -->
        <div class="card-wrapper">
            <div class="popup-top-container" id="popupTopContainer">
                <div class="inset-tabs-wrapper" id="insetTabsWrapper"></div>
                <div class="product-list" id="productList"></div>
            </div>

            <div class="card-container">
                <div class="input-box">
                    <i class="fa-solid fa-mobile-screen-button" style="color:var(--accent-color)"></i>
                    <input type="tel" id="phoneInput" placeholder="Ketik No. HP..." maxlength="15" autocomplete="off" />
                    <span class="operator-badge" id="operatorBadge"></span>
                </div>
            </div>
        </div>

        <div class="section-divider">
            <div class="divider-line"></div>
            <div class="divider-badge"><i class="fa-solid fa-bag-shopping"></i> Menu Utama</div>
            <div class="divider-line"></div>
        </div>

        <!-- Menu Utama -->
        <div class="purchase-container">
            <div class="menu-grid">
                <div class="grid-item" onclick="selectCategory('Pulsa')"><div class="icon-wrapper"><i class="fa-solid fa-mobile-button"></i></div><span>Pulsa</span></div>
                <div class="grid-item" onclick="selectCategory('Data')"><div class="icon-wrapper"><i class="fa-solid fa-globe"></i></div><span>Paket Data</span></div>
                <div class="grid-item" onclick="selectCategory('PLN')"><div class="icon-wrapper"><i class="fa-solid fa-bolt-lightning"></i></div><span>Token PLN</span></div>
                <div class="grid-item" onclick="selectCategory('Voucher')"><div class="icon-wrapper"><i class="fa-solid fa-gem"></i></div><span>Voucher</span></div>
            </div>
        </div>

        <!-- Bottom Nav -->
        <nav class="bottom-nav">
            <a href="/" class="nav-item active"><i class="fa-solid fa-house"></i><span>Home</span></a>
            <a href="/riwayat" class="nav-item"><i class="fa-solid fa-receipt"></i><span>Transaksi</span></a>
            <a href="/member" class="nav-item"><i class="fa-solid fa-user"></i><span>Akun</span></a>
        </nav>

    </div>

    <!-- JAVASCRIPT SYSTEM UNTUK VPS DIGIFLAZZ -->
    <script>
        const prefixes = {
            TELKOMSEL: ['0811', '0812', '0813', '0821', '0822', '0823', '0851', '0852', '0853'],
            INDOSAT: ['0814', '0815', '0816', '0855', '0856', '0857', '0858'],
            XL: ['0817', '0818', '0819', '0859', '0877', '0878'],
            AXIS: ['0831', '0832', '0833', '0838'],
            TRI: ['0895', '0896', '0897', '0898', '0899'],
            SMARTFREN: ['0881', '0882', '0883', '0884', '0885', '0886', '0887', '0888', '0889']
        };

        const inputPhone = document.getElementById('phoneInput');
        const badge = document.getElementById('operatorBadge');
        const popupTopContainer = document.getElementById('popupTopContainer');
        const productList = document.getElementById('productList');
        const insetTabsWrapper = document.getElementById('insetTabsWrapper');

        let allDigiflazzProducts = [];
        let currentOperator = null;
        let selectedCategory = 'Pulsa';

        // Load Saldo Admin dari VPS
        function loadSaldo() {
            fetch('/api/saldo')
                .then(res => res.json())
                .then(res => {
                    if(res.data && res.data.deposit !== undefined) {
                        document.getElementById('user-balance').innerText = new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(res.data.deposit);
                    }
                }).catch(e => console.log("Gagal load saldo:", e));
        }

        // Panggil Price List dari VPS
        function fetchDigiflazzProducts() {
            productList.innerHTML = `<div style="text-align:center; color:var(--accent-color); padding:20px;"><i class="fa-solid fa-spinner fa-spin fa-2x"></i><br><small>Mengambil Produk Digiflazz...</small></div>`;
            popupTopContainer.style.display = 'block';

            fetch('/api/price-list', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ cmd: 'prepaid' })
            })
            .then(res => res.json())
            .then(res => {
                if(res.data && Array.isArray(res.data)) {
                    allDigiflazzProducts = res.data;
                    renderFilteredProducts();
                } else {
                    productList.innerHTML = `<div style="text-align:center; padding:15px; color:var(--text-muted)">Gagal memuat produk dari server.</div>`;
                }
            })
            .catch(err => {
                productList.innerHTML = `<div style="text-align:center; padding:15px; color:red">Error: ${err.message}</div>`;
            });
        }

        function renderFilteredProducts() {
            if(!currentOperator) return;

            // Filter berdasarkan Operator & Kategori
            let filtered = allDigiflazzProducts.filter(p => {
                let brandLower = (p.brand || '').toLowerCase();
                let categoryLower = (p.category || '').toLowerCase();
                let opLower = currentOperator.toLowerCase();

                let isOpMatch = brandLower.includes(opLower) || (opLower === 'indosat' && brandLower.includes('isat'));
                let isCatMatch = categoryLower.includes(selectedCategory.toLowerCase());

                return isOpMatch && isCatMatch && p.buyer_product_status === true;
            });

            // Urutkan Harga Termurah
            filtered.sort((a, b) => a.price - b.price);

            if(filtered.length === 0) {
                productList.innerHTML = `<div style="text-align:center; padding:15px; color:var(--text-muted)">Produk ${selectedCategory} ${currentOperator} tidak tersedia.</div>`;
                return;
            }

            let html = "";
            filtered.forEach(p => {
                let hargaFormatted = new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(p.price);
                html += `
                    <div class="product-card" onclick="beliProduk('${p.buyer_sku_code}', '${p.product_name}', ${p.price})">
                        <div>
                            <div class="product-title">${p.product_name}</div>
                            <small style="color:var(--text-muted); font-size:0.65rem;">${p.note || 'Proses Otomatis'}</small>
                        </div>
                        <div class="product-price">${hargaFormatted}</div>
                    </div>
                `;
            });
            productList.innerHTML = html;
        }

        function beliProduk(sku, nama, harga) {
            let noHp = inputPhone.value.replace(/[^0-9]/g, '');
            if(noHp.length < 4) { alert("Masukkan nomor HP yang benar!"); return; }

            if(confirm(`Beli ${nama} ke ${noHp}?`)) {
                fetch('/api/topup', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ buyer_sku_code: sku, customer_no: noHp })
                })
                .then(res => res.json())
                .then(res => {
                    alert("Status Transaksi: " + (res.data?.status || 'Diproses'));
                })
                .catch(e => alert("Gagal transaksi: " + e.message));
            }
        }

        function selectCategory(cat) {
            selectedCategory = cat;
            if(currentOperator) renderFilteredProducts();
            else alert("Silakan masukkan nomor HP terlebih dahulu!");
        }

        // Cek Prefix Operator
        inputPhone.addEventListener('input', (e) => {
            let val = e.target.value.replace(/[^0-9]/g, '');
            let detectedOp = null;

            if (val.length >= 4) {
                let prefix = val.substring(0, 4);
                for (let op in prefixes) {
                    if (prefixes[op].includes(prefix)) { detectedOp = op; break; }
                }
            }

            if (detectedOp) {
                badge.innerText = detectedOp; badge.style.display = 'inline-block';
                if (currentOperator !== detectedOp) {
                    currentOperator = detectedOp;
                    fetchDigiflazzProducts();
                }
            } else {
                badge.style.display = 'none';
                popupTopContainer.style.display = 'none';
                currentOperator = null;
            }
        });

        // Toggle Sidebar
        document.getElementById('menu-toggle').onclick = () => {
            document.getElementById('sidebar').classList.add('show');
            document.getElementById('sidebar-overlay').classList.add('show');
        };
        document.getElementById('sidebar-close').onclick = document.getElementById('sidebar-overlay').onclick = () => {
            document.getElementById('sidebar').classList.remove('show');
            document.getElementById('sidebar-overlay').classList.remove('show');
        };

        window.onload = loadSaldo;
    </script>
</body>
</html>
