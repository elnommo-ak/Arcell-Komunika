<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Riwayat Transaksi</title>
    <!-- FontAwesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* --- CLEAN WHITE NEUMORPHISM THEME --- */
        :root {
            --bg-base: #e6eaf0;
            --neu-light: #ffffff;
            --neu-dark: #babecc;
            --text-main: #4a5568;
            --text-muted: #8c98a9;
            --accent-purple: #7052ff;
            --border-radius-sm: 14px;
            --border-radius-md: 22px;
            --border-radius-pill: 50px;
            --bottom-nav-height: 70px;

            --neu-shadow-flat: 6px 6px 12px var(--neu-dark), -6px -6px 12px var(--neu-light);
            --neu-shadow-sm: 3px 3px 6px var(--neu-dark), -3px -3px 6px var(--neu-light);
            --neu-shadow-inset: inset 3px 3px 6px var(--neu-dark), inset -3px -3px 6px var(--neu-light);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            min-height: 100vh;
            padding: 16px;
            padding-bottom: calc(var(--bottom-nav-height) + 30px);
        }

        .app-container {
            width: 100%;
            max-width: 480px;
            margin: 0 auto;
        }

        @keyframes popupFromBottom {
            0% { opacity: 0; transform: translateY(10px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .filter-wrapper {
            position: sticky;
            top: 0;
            z-index: 100;
            background-color: var(--bg-base);
            padding: 4px 0 10px 0;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .filter-container {
            flex: 1;
            display: flex;
            gap: 6px;
            padding: 6px;
            background: var(--bg-base);
            border-radius: var(--border-radius-pill);
            box-shadow: var(--neu-shadow-inset);
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }

        .filter-container::-webkit-scrollbar { display: none; }

        .tab-filter {
            flex: 1;
            white-space: nowrap;
            text-align: center;
            padding: 8px 14px;
            font-size: 11px;
            font-weight: 700;
            color: var(--text-muted);
            background: transparent;
            border-radius: var(--border-radius-pill);
            cursor: pointer;
            transition: all 0.2s ease;
            user-select: none;
        }

        .tab-filter.active {
            color: var(--accent-purple); 
            background: var(--bg-base);
            box-shadow: var(--neu-shadow-sm);
        }

        /* Tombol Buka Bottom Sheet Filter */
        .btn-filter-trigger {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: var(--bg-base);
            box-shadow: var(--neu-shadow-flat);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--accent-purple);
            font-size: 14px;
            cursor: pointer;
            border: none;
            flex-shrink: 0;
            transition: all 0.15s ease;
        }

        .btn-filter-trigger:active {
            box-shadow: var(--neu-shadow-inset);
            transform: scale(0.95);
        }

        .date-group {
            margin-top: 14px;
            margin-bottom: 8px;
        }

        .date-header {
            display: inline-block;
            font-size: 11px;
            font-weight: 800;
            color: var(--accent-purple);
            background: var(--bg-base);
            padding: 5px 14px;
            border-radius: 12px;
            box-shadow: var(--neu-shadow-inset);
            margin-bottom: 12px;
            letter-spacing: 0.5px;
        }

        .card {
            background: var(--bg-base);
            border-radius: var(--border-radius-sm);
            padding: 12px 16px;
            margin-bottom: 12px;
            box-shadow: var(--neu-shadow-flat);
            animation: popupFromBottom 0.25s ease forwards;
            cursor: pointer;
            transition: all 0.15s ease;
            border: none;
        }

        .card:active {
            box-shadow: var(--neu-shadow-inset);
            transform: scale(0.985);
        }

        .card-body-content {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }

        .card-left { flex: 1; min-width: 0; }
        .card-right { display: flex; align-items: center; gap: 10px; }

        .header-meta {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 11px;
            margin-bottom: 4px;
        }

        .tx-id { color: var(--text-muted); font-weight: 600; }
        .tx-jam { color: var(--text-muted); font-weight: 700; }
        .tx-target { color: var(--accent-purple); font-weight: 700; display: inline-flex; align-items: center; gap: 4px; }

        .produk-title { 
            font-weight: 800; 
            font-size: 13px; 
            color: var(--text-main); 
            line-height: 1.25;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .produk-status-kirim { 
            font-size: 10px; 
            color: var(--text-muted); 
            margin-top: 4px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            text-overflow: ellipsis;
            line-height: 1.3;
            font-weight: 600;
        }

        .status {
            display: inline-flex;
            align-items: center;
            font-weight: 800;
            padding: 4px 8px;
            border-radius: 8px;
            font-size: 9px;
            text-transform: uppercase;
            background: var(--bg-base);
            box-shadow: var(--neu-shadow-inset);
            white-space: nowrap;
        }

        .status-lunas { color: #10b981; }
        .status-pending { color: #f59e0b; }
        .status-batal { color: #dc3545; }

        .btn-arrow {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            background: var(--bg-base);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--accent-purple);
            font-size: 11px;
            box-shadow: var(--neu-shadow-sm);
            flex-shrink: 0;
        }
        
        .info-text { 
            text-align: center; 
            color: var(--text-muted); 
            margin-top: 24px; 
            font-size: 13px;
            font-weight: 600;
        }

        /* --- BOTTOM SHEET / OVERLAY STYLES --- */
        .sheet-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(2px);
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }

        .sheet-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .bottom-sheet {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            max-width: 480px;
            margin: 0 auto;
            background: var(--bg-base);
            border-radius: 24px 24px 0 0;
            padding: 20px;
            z-index: 1001;
            transform: translateY(100%);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 -10px 25px rgba(0, 0, 0, 0.15);
        }

        .sheet-overlay.active .bottom-sheet {
            transform: translateY(0);
        }

        .sheet-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
        }

        .sheet-title {
            font-size: 15px;
            font-weight: 800;
            color: var(--text-main);
        }

        .btn-close {
            background: var(--bg-base);
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            box-shadow: var(--neu-shadow-sm);
            color: var(--text-muted);
            font-size: 14px;
            cursor: pointer;
        }

        .form-group {
            margin-bottom: 14px;
        }

        .form-label {
            display: block;
            font-size: 11px;
            font-weight: 700;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        .form-input {
            width: 100%;
            padding: 10px 14px;
            font-size: 12px;
            border: none;
            border-radius: var(--border-radius-sm);
            background: var(--bg-base);
            box-shadow: var(--neu-shadow-inset);
            color: var(--text-main);
            outline: none;
            font-weight: 600;
        }

        .form-row {
            display: flex;
            gap: 10px;
        }

        .btn-apply {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            background: var(--accent-purple);
            color: #ffffff;
            border: none;
            border-radius: var(--border-radius-pill);
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(112, 82, 255, 0.3);
            transition: all 0.15s ease;
        }

        .btn-apply:active {
            transform: scale(0.98);
        }

        .btn-reset {
            width: 100%;
            padding: 10px;
            margin-top: 6px;
            background: transparent;
            color: var(--text-muted);
            border: none;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="app-container">
    <div class="filter-wrapper">
        <div class="filter-container">
            <div class="tab-filter active" onclick="filterKategori('semua', this)">Semua</div>
            <div class="tab-filter" onclick="filterKategori('sukses', this)">Sukses</div>
            <div class="tab-filter" onclick="filterKategori('pending', this)">Pending</div>
            <div class="tab-filter" onclick="filterKategori('batal', this)">Batal</div>
        </div>
        <button class="btn-filter-trigger" onclick="toggleBottomSheet(true)" title="Filter Pencarian">
            <i class="fa-solid fa-sliders"></i>
        </button>
    </div>

    <div id="app">
        <div class="info-text" id="status-text">Memuat riwayat transaksi...</div>
    </div>
</div>

<!-- Bottom Sheet Overlay -->
<div class="sheet-overlay" id="sheetOverlay" onclick="toggleBottomSheet(false)">
    <div class="bottom-sheet" onclick="event.stopPropagation()">
        <div class="sheet-header">
            <span class="sheet-title"><i class="fa-solid fa-filter me-2"></i>Filter Pencarian</span>
            <button class="btn-close" onclick="toggleBottomSheet(false)"><i class="fa-solid fa-xmark"></i></button>
        </div>

        <div class="form-group">
            <label class="form-label">Jenis Produk (Opsional)</label>
            <input type="text" id="filterProduk" class="form-input" placeholder="Contoh: Telkomsel, PLN, Dana...">
        </div>

        <div class="form-group">
            <label class="form-label">No. HP / ID Trx (Opsional)</label>
            <input type="text" id="filterQuery" class="form-input" placeholder="Masukkan ID Ref atau No Tujuan">
        </div>

        <div class="form-row">
            <div class="form-group" style="flex: 1;">
                <label class="form-label">Dari Tanggal</label>
                <input type="date" id="filterStartDate" class="form-input">
            </div>
            <div class="form-group" style="flex: 1;">
                <label class="form-label">Ke Tanggal</label>
                <input type="date" id="filterEndDate" class="form-input">
            </div>
        </div>

        <button class="btn-apply" onclick="terapkanFilterPencarian()">Terapkan Filter</button>
        <button class="btn-reset" onclick="resetFilterPencarian()">Reset Filter</button>
    </div>
</div>

<script>
    let totalData = [];
    let kategoriAktif = "semua";

    // State Filter Lanjutan
    let searchFilters = {
        produk: '',
        query: '',
        startDate: '',
        endDate: ''
    };

    function normalizePhone(phone) {
        if (!phone) return '';
        let clean = String(phone).replace(/\D/g, '');
        if (clean.startsWith('62')) clean = '0' + clean.slice(2);
        return clean;
    }

    function toggleBottomSheet(show) {
        const overlay = document.getElementById('sheetOverlay');
        if (show) overlay.classList.add('active');
        else overlay.classList.remove('active');
    }

    function filterKategori(kategori, el) {
        kategoriAktif = kategori;
        document.querySelectorAll('.tab-filter').forEach(tab => tab.classList.remove('active'));
        if (el) el.classList.add('active');
        renderData(totalData);
    }

    function terapkanFilterPencarian() {
        searchFilters.produk = document.getElementById('filterProduk').value.trim().toLowerCase();
        searchFilters.query = document.getElementById('filterQuery').value.trim().toLowerCase();
        searchFilters.startDate = document.getElementById('filterStartDate').value;
        searchFilters.endDate = document.getElementById('filterEndDate').value;

        toggleBottomSheet(false);
        renderData(totalData);
    }

    function resetFilterPencarian() {
        document.getElementById('filterProduk').value = '';
        document.getElementById('filterQuery').value = '';
        document.getElementById('filterStartDate').value = '';
        document.getElementById('filterEndDate').value = '';

        searchFilters = { produk: '', query: '', startDate: '', endDate: '' };
        
        toggleBottomSheet(false);
        renderData(totalData);
    }

    async function muatTransaksiVPS() {
        const container = document.getElementById("app");
        
        try {
            const isLoggedIn = localStorage.getItem('isLoggedIn');
            const rawHp = localStorage.getItem('userPhone') || '';
            const hp = normalizePhone(rawHp);

            if (isLoggedIn !== 'true' || !hp) {
                container.innerHTML = `
                    <div class="info-text">
                        <i class="fa-solid fa-lock" style="font-size:28px; margin-bottom:12px; color:var(--accent-purple);"></i><br>
                        Silakan login terlebih dahulu untuk melihat riwayat transaksi.
                    </div>`;
                return;
            }

            const response = await fetch(`/api/history?phone=${encodeURIComponent(hp)}&hp=${encodeURIComponent(hp)}`);
            const res = await response.json();

            const dataList = Array.isArray(res) ? res : (res.data || []);

            // Filter transaksi khusus member yang sedang login & ambil maksimal 100 terbaru
            const myDataList = dataList.filter(item => {
                const itemHp = normalizePhone(item.user_hp || item.customer_no || item.phone || '');
                return itemHp !== '' && itemHp === hp;
            }).slice(0, 100);

            if (myDataList.length > 0) {
                totalData = myDataList;
                renderData(totalData);
            } else {
                container.innerHTML = '<div class="info-text"><i class="fa-solid fa-receipt" style="font-size:24px; margin-bottom:10px;"><br></i>Belum ada riwayat transaksi.</div>';
            }
        } catch (err) {
            console.error(err);
            container.innerHTML = '<div class="info-text">Gagal terhubung ke Server.</div>';
        }
    }

    function parseWaktu(strWaktu) {
        if (!strWaktu) return { tanggal: 'Hari Ini', jam: '' };
        
        let formattedStr = strWaktu.trim().replace(' ', 'T');
        if (!formattedStr.endsWith('Z')) {
            formattedStr += 'Z';
        }

        const d = new Date(formattedStr);

        if (!isNaN(d.getTime())) {
            const yyyy = d.getFullYear();
            const mm = String(d.getMonth() + 1).padStart(2, '0');
            const dd = String(d.getDate()).padStart(2, '0');

            const hh = String(d.getHours()).padStart(2, '0');
            const min = String(d.getMinutes()).padStart(2, '0');
            const ss = String(d.getSeconds()).padStart(2, '0');

            return {
                tanggal: `${yyyy}-${mm}-${dd}`,
                jam: `${hh}:${min}:${ss}`
            };
        }

        const parts = strWaktu.trim().split(/[\s,T]+/);
        return { tanggal: parts[0] || 'Hari Ini', jam: parts[1] || '' };
    }

    function renderData(list) {
        const container = document.getElementById("app");
        
        const dataFiltered = list.filter(item => {
            // 1. Filter Kategori Status Tab
            const st = (item.status || "PENDING").toLowerCase();
            if (kategoriAktif === "sukses" && !(st === "sukses" || st === "lunas")) return false;
            if (kategoriAktif === "pending" && !(st === "pending" || st === "proses")) return false;
            if (kategoriAktif === "batal" && !(st === "batal" || st === "gagal")) return false;

            // 2. Filter Jenis Produk (Hanya dicek jika kolom diisi)
            if (searchFilters.produk) {
                const namaProduk = (item.produk || item.product_name || item.sku || '').toLowerCase();
                if (!namaProduk.includes(searchFilters.produk)) return false;
            }

            // 3. Filter No HP / ID Trx (Hanya dicek jika kolom diisi)
            if (searchFilters.query) {
                const noTujuan = (item.no_tujuan || item.customer_no || item.user_hp || '').toLowerCase();
                const refId = (item.ref_id || '').toLowerCase();
                if (!noTujuan.includes(searchFilters.query) && !refId.includes(searchFilters.query)) return false;
            }

            // 4. Filter Dari Tanggal & Ke Tanggal (Bisa diisi salah satu atau keduanya)
            const { tanggal } = parseWaktu(item.waktu);
            if (searchFilters.startDate && tanggal < searchFilters.startDate) return false;
            if (searchFilters.endDate && tanggal > searchFilters.endDate) return false;

            return true;
        });

        if (dataFiltered.length === 0) {
            container.innerHTML = `<div class="info-text">Tidak ada transaksi yang sesuai kriteria.</div>`;
            return;
        }

        const groupedData = {};
        dataFiltered.forEach(item => {
            const { tanggal } = parseWaktu(item.waktu);
            if (!groupedData[tanggal]) groupedData[tanggal] = [];
            groupedData[tanggal].push(item);
        });

        let htmlList = "";

        for (const tanggal in groupedData) {
            htmlList += `
                <div class="date-group">
                    <div class="date-header"><i class="fa-regular fa-calendar-days me-1"></i> ${tanggal}</div>
            `;

            groupedData[tanggal].forEach(item => {
                const statusStr = (item.status || "PENDING").toUpperCase();
                let statusClass = "status-pending";

                if (statusStr === "SUKSES" || statusStr === "LUNAS") statusClass = "status-lunas";
                if (statusStr === "BATAL" || statusStr === "GAGAL") statusClass = "status-batal";

                const { jam } = parseWaktu(item.waktu);
                const noTujuan = item.no_tujuan || item.customer_no || item.user_hp || '';
                const namaProduk = item.produk || item.product_name || item.sku || 'Produk PPOB';

                var rawSn = item.sn || item.serial_number || item.serialNumber || item.nomor_resi || item.resi || item.sn_resi || '';
                
                if (!rawSn && (item.message || item.keterangan || item.catatan || item.note || item.pesan)) {
                    var teksPesan = item.message || item.keterangan || item.catatan || item.note || item.pesan;
                    var matchSn = teksPesan.match(/SN[\/\:\s]+([A-Za-z0-9\.\/\-]+)/i);
                    if (matchSn && matchSn[1]) {
                        rawSn = matchSn[1].trim();
                    }
                }

                var displaySn = (rawSn && rawSn !== '' && rawSn !== '-') ? 'SN: ' + rawSn : '';

                htmlList += `
                    <div class="card" onclick="window.location.href='detail.html?id=${encodeURIComponent(item.ref_id)}'">
                        <div class="header-meta">
                            <span class="tx-id">#${item.ref_id || 'ARC'}</span>
                            ${jam ? `<span class="tx-jam">• ${jam}</span>` : ''}
                            ${noTujuan ? `<span class="tx-target"><i class="fa-solid fa-mobile-screen-button"></i>${noTujuan}</span>` : ''}
                        </div>
                        <div class="card-body-content">
                            <div class="card-left">
                                <div class="produk-title">${namaProduk}</div>
                                <div class="produk-status-kirim">${displaySn}</div>
                            </div>
                            <div class="card-right">
                                <span class="status ${statusClass}">${statusStr}</span>
                                <div class="btn-arrow"><i class="fa-solid fa-chevron-right"></i></div>
                            </div>
                        </div>
                    </div>
                `;
            });

            htmlList += `</div>`;
        }
        
        container.innerHTML = htmlList;
    }

    document.addEventListener("DOMContentLoaded", muatTransaksiVPS);
</script>

</body>
</html>
