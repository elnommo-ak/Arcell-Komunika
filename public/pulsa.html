<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Pembelian Pulsa - Arcell</title>
  
  <!-- Font Awesome, Google Font & Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <style>
    :root {
      /* Neumorphism Clean White Palette */
      --bg-color: #f0f2f5;
      --shadow-light: #ffffff;
      --shadow-dark: #d1d9e6;
      
      --accent-pink: #ec4899;          /* Aksen Pink Soft */
      --accent-blue: #3b82f6;          /* Aksen Blue Soft */
      --accent-color: #64748b;         /* Slate Main Accent */
      
      --text-main: #64748b;            /* Teks Soft Slate */
      --text-muted: #94a3b8;           /* Teks Muted Gray */
      --text-bold: #475569;            /* Teks Gelap Minimalis */
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Poppins', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-color);
      min-height: 100vh;
      color: var(--text-main);
      padding-bottom: 20px;
    }

    /* Kunci Scroll Saat Pop-Up Aktif */
    body.no-scroll {
      overflow: hidden !important;
      touch-action: none;
    }

    /* Input Card Section */
    .card-wrapper {
      position: -webkit-sticky;
      position: sticky;
      top: 0;
      z-index: 101;
      padding: 16px;
      background-color: var(--bg-color);
    }

    .input-pill-container {
      background: var(--bg-color);
      border-radius: 30px;
      padding: 6px 6px 6px 14px;
      display: flex;
      align-items: center;
      /* Soft Neumorphic Inset Shadow */
      box-shadow: inset 4px 4px 8px var(--shadow-dark), 
                  inset -4px -4px 8px var(--shadow-light);
      transition: all 0.25s ease;
    }

    .input-icon-left {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: var(--bg-color);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent-pink);
      font-size: 14px;
      margin-right: 8px;
      box-shadow: 3px 3px 6px var(--shadow-dark), 
                 -3px -3px 6px var(--shadow-light);
    }

    .input-pill-container input {
      border: none;
      outline: none;
      flex: 1;
      font-size: 13.5px;
      font-weight: 600;
      color: var(--text-bold);
      background: transparent;
      letter-spacing: 0.5px;
    }

    .input-pill-container input::placeholder {
      color: var(--text-muted);
      font-weight: 500;
      font-size: 13px;
    }

    .operator-badge {
      background: var(--bg-color);
      color: var(--accent-blue);
      padding: 4px 10px;
      border-radius: 14px;
      font-size: 10px;
      font-weight: 700;
      display: none;
      text-transform: uppercase;
      margin-right: 6px;
      letter-spacing: 0.5px;
      box-shadow: 2px 2px 5px var(--shadow-dark), 
                 -2px -2px 5px var(--shadow-light);
    }

    .input-icon-right {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--bg-color);
      color: var(--text-bold);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      cursor: pointer;
      box-shadow: 4px 4px 8px var(--shadow-dark), 
                 -4px -4px 8px var(--shadow-light);
      transition: transform 0.2s, box-shadow 0.2s;
    }
    
    .input-icon-right:active {
      transform: scale(0.92);
      box-shadow: inset 2px 2px 4px var(--shadow-dark), 
                  inset -2px -2px 4px var(--shadow-light);
    }

    /* Filter Bar */
    .filter-container {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      padding: 0 16px 12px 16px;
    }

    .filter-select-wrapper {
      position: relative;
      display: inline-block;
    }

    .filter-select {
      background: var(--bg-color);
      color: var(--text-bold);
      font-size: 11px;
      font-weight: 600;
      border: none;
      outline: none;
      padding: 8px 30px 8px 16px;
      border-radius: 20px;
      cursor: pointer;
      box-shadow: 4px 4px 8px var(--shadow-dark), 
                 -4px -4px 8px var(--shadow-light);
      appearance: none;
      -webkit-appearance: none;
    }

    .filter-select-wrapper::after {
      content: '\f0dc';
      font-family: 'Font Awesome 6 Free';
      font-weight: 900;
      font-size: 9px;
      color: var(--accent-blue);
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      pointer-events: none;
    }

    /* Empty State */
    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin-top: 40px;
      color: var(--text-muted);
      text-align: center;
      padding: 0 20px;
    }

    .empty-state i {
      font-size: 32px;
      color: var(--accent-pink);
      margin-bottom: 16px;
      background: var(--bg-color);
      padding: 24px;
      border-radius: 50%;
      box-shadow: 8px 8px 16px var(--shadow-dark), 
                 -8px -8px 16px var(--shadow-light);
    }

    .empty-state p {
      font-size: 13px;
      font-weight: 600;
      line-height: 1.4;
      color: var(--text-bold);
    }

    .fa-spin {
      animation: fa-spin 1s infinite linear;
    }

    /* Content Area */
    .content-area {
      display: none;
    }

    /* Tab Subkategori Kapsul */
    .sticky-tabs-container {
      position: -webkit-sticky;
      position: sticky;
      top: 76px;
      z-index: 100;
      background-color: var(--bg-color);
      padding: 4px 16px 12px 16px;
    }

    .tabs-wrapper {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      scrollbar-width: none;
      padding: 4px 2px;
    }

    .tabs-wrapper::-webkit-scrollbar {
      display: none;
    }

    .tab-item {
      white-space: nowrap;
      padding: 9px 20px;
      border-radius: 22px;
      border: none;
      background: var(--bg-color);
      color: var(--text-main);
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 4px 4px 8px var(--shadow-dark), 
                 -4px -4px 8px var(--shadow-light);
    }

    .tab-item.active {
      color: var(--accent-blue);
      box-shadow: inset 3px 3px 6px var(--shadow-dark), 
                  inset -3px -3px 6px var(--shadow-light);
    }

    /* Container Inset / Product Section */
    .product-inset-wrapper {
      margin: 0 16px;
      background: var(--bg-color);
      border-radius: 28px;
      padding: 18px;
      box-shadow: 8px 8px 16px var(--shadow-dark), 
                 -8px -8px 16px var(--shadow-light);
    }

    .product-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .product-card {
      background: var(--bg-color);
      border-radius: 20px;
      padding: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      box-shadow: 5px 5px 10px var(--shadow-dark), 
                 -5px -5px 10px var(--shadow-light);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .product-card:active {
      transform: scale(0.98);
      box-shadow: inset 3px 3px 6px var(--shadow-dark), 
                  inset -3px -3px 6px var(--shadow-light);
    }

    .product-info {
      flex: 1;
      padding-right: 12px;
    }

    .product-title {
      font-size: 12.5px;
      font-weight: 700;
      color: var(--text-bold);
      line-height: 1.3;
      margin-bottom: 4px;
    }

    .product-price {
      font-size: 14px;
      font-weight: 700;
      color: var(--accent-blue);
    }

    .product-action {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: var(--bg-color);
      color: var(--accent-pink);
      box-shadow: 3px 3px 6px var(--shadow-dark), 
                 -3px -3px 6px var(--shadow-light);
      font-size: 11px;
    }

    /* POP-UP BOTTOM SHEET NEUMORPHISM */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100vh;
      background: rgba(100, 116, 139, 0.25); 
      z-index: 1040;
      display: none;
      opacity: 0;
      transition: opacity 0.25s ease;
    }

    .modal-overlay.show {
      display: block;
      opacity: 1;
    }

    .checkout-page {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      margin: 0 auto;
      width: 100%;
      max-width: 600px;
      max-height: 85vh;
      min-height: 380px;
      background-color: var(--bg-color);
      display: flex;
      flex-direction: column;
      z-index: 1050;
      overflow: hidden;
      border-top-left-radius: 32px;
      border-top-right-radius: 32px;
      box-shadow: 0 -10px 30px rgba(0, 0, 0, 0.08);
      transform: translateY(100%);
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      touch-action: none;
    }

    .checkout-page.show {
      transform: translateY(0);
    }

    .drag-zone {
      width: 100%;
      padding: 12px 0 6px 0;
      cursor: grab;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: var(--bg-color);
      flex-shrink: 0;
    }

    .bottom-sheet-handle {
      width: 48px;
      height: 5px;
      background-color: #cbd5e1;
      border-radius: 10px;
    }

    .checkout-header {
      flex-shrink: 0;
      background-color: var(--bg-color);
      border-bottom: 1px solid rgba(209, 217, 230, 0.5);
      padding: 4px 18px 12px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .checkout-content {
      flex: 1 1 auto;
      overflow-y: auto;
      padding: 14px 18px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      touch-action: pan-y;
    }

    .simple-card {
      background: var(--bg-color);
      border-radius: 20px;
      box-shadow: 5px 5px 10px var(--shadow-dark), 
                 -5px -5px 10px var(--shadow-light);
      border: none;
      overflow: hidden;
      width: 100%;
    }

    .simple-card-header {
      padding: 10px 14px;
      background: var(--bg-color);
      border-bottom: 1px solid rgba(209, 217, 230, 0.3);
      color: var(--text-bold);
      font-size: 11px;
      font-weight: 700;
    }

    .neo-inset-box {
      background: var(--bg-color);
      border-radius: 16px;
      padding: 10px 12px;
      box-shadow: inset 3px 3px 6px var(--shadow-dark), 
                  inset -3px -3px 6px var(--shadow-light);
    }

    .saldo-box-minimal {
      background: var(--bg-color);
      border-radius: 16px;
      padding: 10px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: inset 3px 3px 6px var(--shadow-dark), 
                  inset -3px -3px 6px var(--shadow-light);
    }

    .ukuran_teks_detail {
      font-size: 11px;
      line-height: 1.4;
    }

    .item-row-divider {
      border-bottom: 1px dashed rgba(209, 217, 230, 0.8);
      padding-bottom: 6px;
      margin-bottom: 6px;
    }

    .deskripsi-produk-box {
      font-size: 10.5px;
      color: var(--text-muted);
      line-height: 1.4;
      background: var(--bg-color);
      padding: 8px 10px;
      border-radius: 12px;
      margin-top: 6px;
      word-break: break-word;
      box-shadow: inset 2px 2px 4px var(--shadow-dark), 
                  inset -2px -2px 4px var(--shadow-light);
    }

    .sticky-info-bar {
      background: var(--bg-color);
      border-top: 1px solid rgba(209, 217, 230, 0.4);
      padding: 8px 12px;
      text-align: center;
      font-size: 10px;
      color: var(--text-muted);
      flex-shrink: 0;
    }

    .checkout-footer {
      background: var(--bg-color);
      border-top: 1px solid rgba(209, 217, 230, 0.4);
      padding: 12px 18px;
      flex-shrink: 0;
    }

    /* Slide To Pay Component */
    .slide-pay-container {
      position: relative;
      height: 48px;
      background: var(--bg-color);
      border-radius: 20px;
      box-shadow: inset 4px 4px 8px var(--shadow-dark), 
                  inset -4px -4px 8px var(--shadow-light);
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
      touch-action: pan-x;
      overflow: hidden;
    }

    .slide-pay-text {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-bold);
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      transition: opacity 0.2s ease;
      z-index: 1;
    }

    .slide-pay-handle {
      position: absolute;
      left: 4px;
      top: 4px;
      width: 40px;
      height: 40px;
      background: var(--bg-color);
      color: var(--accent-pink);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 4px 4px 8px var(--shadow-dark), 
                 -4px -4px 8px var(--shadow-light);
      z-index: 3;
    }
  </style>
</head>
<body>

  <!-- Input Area Sticky Sesuai Desain Neumorphism Soft White -->
  <div class="card-wrapper">
    <div class="input-pill-container">
      <div class="input-icon-left">
        <i class="fa-solid fa-heart"></i>
      </div>
      <input 
        type="tel" 
        id="phoneInput" 
        class="bo_input_nomor"
        placeholder="Ketik No. HP..." 
        maxlength="20"
        autocomplete="off"
      />
      <span class="operator-badge" id="operatorBadge"></span>
      <div class="input-icon-right bo_tombol_kontak">
        <i class="fa-solid fa-address-book"></i>
      </div>
    </div>
  </div>

  <!-- Empty / Loading State -->
  <div class="empty-state" id="emptyState">
    <i class="fa-solid fa-sim-card" id="stateIcon"></i>
    <p id="emptyText">Silakan masukkan nomor telepon<br>untuk melihat pilihan pulsa</p>
  </div>

  <!-- Content Area -->
  <div class="content-area" id="contentArea">
    
    <!-- Tab Subkategori Kapsul -->
    <div class="sticky-tabs-container">
      <div class="tabs-wrapper" id="tabsWrapper"></div>
    </div>

    <!-- Filter Urutan Harga -->
    <div class="filter-container">
      <div class="filter-select-wrapper">
        <select id="sortFilter" class="filter-select" onchange="applyPriceSort()">
          <option value="asc">Harga: Murah ke Mahal</option>
          <option value="desc">Harga: Mahal ke Murah</option>
        </select>
      </div>
    </div>

    <!-- Kontainer Produk dengan Neumorphism Outer Card -->
    <div class="product-inset-wrapper">
      <div class="product-list" id="productList"></div>
    </div>
  </div>

  <!-- MODAL POP-UP BOTTOM SHEET -->
  <div class="modal-overlay" id="modalOverlay" onclick="closeBottomSheet()"></div>

  <div class="checkout-page" id="checkoutSheet">
    <!-- Handle Area yang dapat di-drag/swipe -->
    <div class="drag-zone" id="dragZone">
      <div class="bottom-sheet-handle"></div>
    </div>

    <div class="checkout-header">
      <span class="fw-bold text-dark" style="font-size: 13px; font-weight:700; color: var(--text-bold) !important;">
        <i class="bi bi-receipt me-2" style="color:var(--accent-pink);"></i>Rincian Pembayaran
      </span>
      <i class="bi bi-x-circle-fill text-secondary" style="cursor: pointer; font-size: 18px;" onclick="closeBottomSheet()"></i>
    </div>

    <div class="checkout-content" id="sheetContent">
      <!-- Card Detail Produk -->
      <div class="simple-card">
        <div class="simple-card-header">
          <i class="bi bi-box-seam me-2" style="color: var(--accent-blue);"></i>Detail Produk
        </div>
        <div style="padding: 10px;">
          <div class="neo-inset-box" id="detailProdukBox"></div>
        </div>
      </div>

      <!-- Kolom Saldo Minimalis -->
      <div class="simple-card">
        <div class="simple-card-header">
          <i class="bi bi-wallet2 me-2" style="color: var(--accent-blue);"></i>Metode Pembayaran
        </div>
        <div style="padding: 10px;">
          <div class="saldo-box-minimal">
            <div class="d-flex align-items-center gap-2">
              <i class="bi bi-wallet-fill" style="color: var(--accent-blue); font-size: 14px;"></i>
              <span style="font-size: 11px; font-weight: 700; color: var(--text-bold);">Saldo Akun</span>
            </div>
            <span style="font-size: 10px; font-weight: 600; color: #3b82f6; background: var(--bg-color); padding: 4px 10px; border-radius: 12px; box-shadow: 2px 2px 4px var(--shadow-dark), -2px -2px 4px var(--shadow-light);">
              Otomatis Potong
            </span>
          </div>
        </div>
      </div>
    </div>

    <div class="sticky-info-bar">
      <i class="bi bi-info-circle me-1" style="color: var(--accent-blue);"></i> Periksa kembali nomor tujuan sebelum melakukan transaksi
    </div>

    <!-- Footer: Total Belanja & Slide Bar -->
    <div class="checkout-footer">
      <div class="d-flex align-items-center gap-2" style="display: flex; align-items: center; gap: 10px;">
        
        <!-- Total Belanja Sebelah Kiri -->
        <div style="min-width: 95px;" class="d-flex flex-column justify-content-center">
          <span style="font-size: 9px; color: var(--text-muted); font-weight:600; line-height: 1;">Total Belanja</span>
          <span style="font-size: 13.5px; font-weight: 700; color: var(--accent-blue); margin-top: 2px;" id="totalBayarText">Rp 0</span>
        </div>

        <!-- Slide to Pay Bar -->
        <div class="slide-pay-container" style="flex: 1;" id="slidePayContainer">
          <div class="slide-pay-text" id="slidePayText">
            <span>Geser Untuk Membayar</span> <i class="bi bi-chevrons-right ms-1" style="color:var(--accent-pink);"></i>
          </div>
          <div class="slide-pay-handle" id="slidePayHandle">
            <i class="bi bi-arrow-right-short" style="font-size: 20px;"></i>
          </div>
        </div>

      </div>
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

  <script>
    const prefixes = {
      TELKOMSEL: ['0811', '0812', '0813', '0821', '0822', '0823', '0851', '0852', '0853'],
      INDOSAT: ['0814', '0815', '0816', '0855', '0856', '0857', '0858'],
      XL: ['0817', '0818', '0819', '0859', '0877', '0878'],
      AXIS: ['0831', '0832', '0833', '0838'],
      TRI: ['0895', '0896', '0897', '0898', '0899'],
      SMARTFREN: ['0881', '0882', '0883', '0884', '0885', '0886', '0887', '0888', '0889']
    };

    const inputPhone = document.getElementById('phoneInput');
    const badge = document.getElementById('operatorBadge');
    const emptyState = document.getElementById('emptyState');
    const emptyText = document.getElementById('emptyText');
    const stateIcon = document.getElementById('stateIcon');
    const contentArea = document.getElementById('contentArea');
    const tabsWrapper = document.getElementById('tabsWrapper');
    const productList = document.getElementById('productList');
    const sortFilter = document.getElementById('sortFilter');

    let currentOperator = null;
    let groupedProducts = {};
    let currentRawProducts = [];
    let selectedProduct = null;
    let isTransactionLocked = false;

    function showLoading(text) {
      contentArea.style.display = 'none';
      emptyState.style.display = 'flex';
      stateIcon.className = "fa-solid fa-spinner fa-spin";
      emptyText.innerHTML = text;
    }

    // 🔹 PANGGIL API DIGIFLAZZ VPS UNTUK PRODUK PULSA
    async function loadKategoriByOperator(operatorKey) {
      showLoading(`Mencari pulsa untuk <b>${operatorKey}</b>...`);

      try {
        const response = await fetch('/api/digiflazz/price-list', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ brand: operatorKey })
        });
        
        const res = await response.json();

        if (res.status === 'success' && res.data && res.data.length > 0) {
          
          // Filter hanya produk Pulsa Reguler / Transfer (Memblokir Paket Data / PLN / Masa Aktif)
          const pulsaProducts = res.data.filter(p => {
            if (!p.buyer_product_status || !p.seller_product_status) return false;
            
            const categoryLower = (p.category || "").toLowerCase();
            const nameLower = (p.product_name || "").toLowerCase();

            const isPulsa = categoryLower.includes("pulsa") || nameLower.includes("pulsa");
            const isBlocked = nameLower.includes("data") || 
                              nameLower.includes("kuota") || 
                              nameLower.includes("masa aktif") || 
                              nameLower.includes("sms") || 
                              nameLower.includes("telepon");

            return isPulsa && !isBlocked;
          });

          if (pulsaProducts.length === 0) {
            stateIcon.className = "fa-solid fa-box-open";
            emptyText.innerText = "Produk Pulsa " + operatorKey + " sedang tidak tersedia.";
            return;
          }

          // Kelompokkan Produk ke Sub-Tab (Misal: Pulsa Reguler, Pulsa Transfer)
          groupedProducts = {};
          pulsaProducts.forEach(prod => {
            let tabGroup = "Pulsa Reguler";
            const nameLower = prod.product_name.toLowerCase();
            if (nameLower.includes("transfer") || nameLower.includes("tp")) {
              tabGroup = "Pulsa Transfer";
            }

            if (!groupedProducts[tabGroup]) groupedProducts[tabGroup] = [];
            groupedProducts[tabGroup].push(prod);
          });

          const tabKeys = Object.keys(groupedProducts);
          renderTabs(tabKeys);

        } else {
          stateIcon.className = "fa-solid fa-triangle-exclamation";
          emptyText.innerText = "Gagal memuat produk dari server.";
        }
      } catch (err) {
        console.error(err);
        stateIcon.className = "fa-solid fa-triangle-exclamation";
        emptyText.innerText = "Gagal terhubung ke server backend VPS.";
      }
    }

    function renderTabs(tabKeysArray) {
      let html = "";
      tabKeysArray.forEach((cat, index) => {
        html += `<button class="tab-item ${index === 0 ? 'active' : ''}" onclick="selectSubKategori(this, '${cat}')">${cat}</button>`;
      });

      tabsWrapper.innerHTML = html;
      emptyState.style.display = 'none';
      contentArea.style.display = 'block';

      if (tabKeysArray.length > 0) {
        selectSubKategori(tabsWrapper.children[0], tabKeysArray[0]);
      }
    }

    function selectSubKategori(element, tabName) {
      document.querySelectorAll('.tab-item').forEach(el => el.classList.remove('active'));
      if (element) element.classList.add('active');

      currentRawProducts = groupedProducts[tabName] || [];
      applyPriceSort();
    }

    function applyPriceSort() {
      if (!currentRawProducts || currentRawProducts.length === 0) {
        productList.innerHTML = `<div style="text-align:center; color:var(--text-muted); padding:24px; font-size:12px;">Belum ada produk pulsa di kategori ini.</div>`;
        return;
      }

      var sortValue = sortFilter.value;
      var sortedProducts = [...currentRawProducts];

      sortedProducts.sort(function(a, b) {
        var hargaA = parseFloat(a.price || 0);
        var hargaB = parseFloat(b.price || 0);
        return sortValue === 'asc' ? hargaA - hargaB : hargaB - hargaA;
      });

      renderProdukCards(sortedProducts);
    }

    function renderProdukCards(produkList) {
      var html = "";
      produkList.forEach(function(prod, index) {
        var hargaFormatted = formatRupiah(prod.price || 0);
        
        html += `
          <div class="product-card" onclick="openBottomSheetByIndex(${index})">
            <div class="product-info">
              <div class="product-title">${prod.product_name}</div>
              <div class="product-price">${hargaFormatted}</div>
            </div>
            <div class="product-action">
              <i class="fa-solid fa-chevron-right"></i>
            </div>
          </div>
        `;
      });
      productList.innerHTML = html;
    }

    /* ========================================= */
    /* LOGIKA POP-UP & CHECKOUT SWIPE PAY        */
    /* ========================================= */
    function openBottomSheetByIndex(index) {
      var prod = currentRawProducts[index];
      if (!prod) return;

      var nomorTujuan = inputPhone.value.replace(/[^0-9]/g, '');
      if(nomorTujuan.length < 4) {
        alert('Silakan masukkan nomor tujuan yang valid/lengkap terlebih dahulu.');
        inputPhone.focus();
        return;
      }

      selectedProduct = prod;

      var deskripsiText = prod.desc || "Pulsa Elektrik " + currentOperator;

      var detailHtml = `
        <div class="d-flex justify-content-between align-items-center item-row-divider" style="display:flex; justify-content:space-between; margin-bottom:6px;">
          <span class="ukuran_teks_detail text-secondary fw-semibold">Nama Produk</span>
          <span class="fw-bold text-dark text-end ukuran_teks_detail text-break ms-2" style="color:var(--text-bold) !important;">${prod.product_name}</span>
        </div>
        <div class="d-flex justify-content-between align-items-center item-row-divider" style="display:flex; justify-content:space-between; margin-bottom:6px;">
          <span class="ukuran_teks_detail text-secondary fw-semibold">Nomor Tujuan</span>
          <span class="fw-bold ukuran_teks_detail" style="color:var(--accent-blue);">${nomorTujuan}</span>
        </div>
        <div class="d-flex justify-content-between align-items-center item-row-divider" style="display:flex; justify-content:space-between; margin-bottom:6px;">
          <span class="ukuran_teks_detail text-secondary fw-semibold">Kode SKU</span>
          <span class="fw-semibold text-muted ukuran_teks_detail">#${prod.buyer_sku_code}</span>
        </div>
        <div class="d-flex justify-content-between align-items-center" style="display:flex; justify-content:space-between;">
          <span class="ukuran_teks_detail text-secondary fw-semibold">Harga</span>
          <span class="fw-bold ukuran_teks_detail" style="color:var(--accent-blue);">${formatRupiah(prod.price || 0)}</span>
        </div>
        ${deskripsiText ? `<div class="deskripsi-produk-box"><b>Keterangan:</b> ${deskripsiText}</div>` : ''}
      `;

      document.getElementById('detailProdukBox').innerHTML = detailHtml;
      document.getElementById('totalBayarText').innerText = formatRupiah(prod.price || 0);

      document.body.classList.add('no-scroll');

      document.getElementById('modalOverlay').classList.add('show');
      document.getElementById('checkoutSheet').classList.add('show');
      document.getElementById('checkoutSheet').style.transform = "translateY(0)";

      initSlideToPay();
      setupSwipeGesture();
    }

    function closeBottomSheet() {
      var sheet = document.getElementById('checkoutSheet');
      sheet.style.transform = "translateY(100%)";
      
      document.getElementById('modalOverlay').classList.remove('show');
      document.body.classList.remove('no-scroll');

      setTimeout(() => {
        sheet.classList.remove('show');
      }, 300);
    }

    function setupSwipeGesture() {
      const sheet = document.getElementById('checkoutSheet');
      const dragZone = document.getElementById('dragZone');
      const content = document.getElementById('sheetContent');

      let startY = 0;
      let currentY = 0;
      let isDragging = false;

      function onTouchStart(e) {
        if (content.scrollTop > 0 && e.target !== dragZone) return;
        startY = e.touches ? e.touches[0].clientY : e.clientY;
        isDragging = true;
        sheet.style.transition = 'none';
      }

      function onTouchMove(e) {
        if (!isDragging) return;
        currentY = e.touches ? e.touches[0].clientY : e.clientY;
        let deltaY = currentY - startY;

        if (deltaY > 0) {
          sheet.style.transform = `translateY(${deltaY}px)`;
        } else if (deltaY < 0 && deltaY > -60) {
          sheet.style.transform = `translateY(${deltaY * 0.2}px)`;
        }
      }

      function onTouchEnd() {
        if (!isDragging) return;
        isDragging = false;
        sheet.style.transition = 'transform 0.3s cubic-bezier(0.16, 1, 0.3, 1)';
        let deltaY = currentY - startY;

        if (deltaY > 120) {
          closeBottomSheet();
        } else {
          sheet.style.transform = 'translateY(0)';
        }
      }

      dragZone.ontouchstart = onTouchStart;
      dragZone.ontouchmove = onTouchMove;
      dragZone.ontouchend = onTouchEnd;

      sheet.ontouchstart = onTouchStart;
      sheet.ontouchmove = onTouchMove;
      sheet.ontouchend = onTouchEnd;
    }

    function initSlideToPay() {
      const container = document.getElementById('slidePayContainer');
      const handle = document.getElementById('slidePayHandle');
      const text = document.getElementById('slidePayText');
      
      if(!container || !handle) return;

      let isDragging = false;
      let startX = 0;
      let currentX = 0;
      let maxSlide = 0;

      function updateMaxSlide() {
        maxSlide = container.clientWidth - handle.clientWidth - 8;
      }
      updateMaxSlide();

      handle.style.transform = 'translateX(0px)';
      text.style.opacity = '1';

      function updateBgFill(deltaX) {
        let percentage = Math.min(100, Math.max(0, ((deltaX + 20) / container.clientWidth) * 100));
        container.style.background = `linear-gradient(to right, rgba(236, 72, 153, 0.15) ${percentage}%, var(--bg-color) ${percentage}%)`;
      }

      function resetBgFill() {
        container.style.background = 'var(--bg-color)';
      }

      function onStart(e) {
        if(isTransactionLocked) return;
        isDragging = true;
        startX = e.type.includes('touch') ? e.touches[0].clientX : e.clientX;
        handle.style.transition = 'none';
      }

      function onMove(e) {
        if (!isDragging) return;
        const clientX = e.type.includes('touch') ? e.touches[0].clientX : e.clientX;
        let deltaX = clientX - startX;
        
        if (deltaX < 0) deltaX = 0;
        if (deltaX > maxSlide) deltaX = maxSlide;

        currentX = deltaX;
        handle.style.transform = `translateX(${deltaX}px)`;
        updateBgFill(deltaX);

        let opacity = 1 - (deltaX / maxSlide);
        text.style.opacity = opacity;
      }

      function onEnd() {
        if (!isDragging) return;
        isDragging = false;

        if (currentX >= maxSlide * 0.85) {
          handle.style.transition = 'transform 0.15s ease-out';
          handle.style.transform = `translateX(${maxSlide}px)`;
          text.style.opacity = '0';
          updateBgFill(maxSlide);
          
          prosesTransaksiDigiflazz();
        } else {
          handle.style.transition = 'transform 0.2s ease-out';
          handle.style.transform = 'translateX(0px)';
          text.style.opacity = '1';
          resetBgFill();
        }
      }

      handle.onmousedown = onStart;
      window.onmousemove = onMove;
      window.onmouseup = onEnd;

      handle.ontouchstart = onStart;
      window.ontouchmove = onMove;
      window.ontouchend = onEnd;
    }

    // 🔹 PROSES CHECKOUT DIGIFLAZZ KE BACKEND VPS
    async function prosesTransaksiDigiflazz() {
      if (!selectedProduct) return;
      isTransactionLocked = true;

      const slideText = document.getElementById('slidePayText');
      slideText.innerHTML = '<span>Memproses...</span>';
      slideText.style.opacity = '1';

      const nomorTujuan = inputPhone.value.replace(/[^0-9]/g, '');
      const userSession = JSON.parse(localStorage.getItem('arcell_user') || '{}');

      try {
        const response = await fetch('/api/digiflazz/checkout', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            buyer_sku_code: selectedProduct.buyer_sku_code,
            customer_no: nomorTujuan,
            user_hp: userSession.hp || nomorTujuan
          })
        });

        const res = await response.json();

        if (res.status === 'success') {
          alert(`✅ Transaksi Berhasil!\n\nProduk: ${selectedProduct.product_name}\nTujuan: ${nomorTujuan}\nStatus: Diproses/Sukses`);
          closeBottomSheet();
          window.location.href = '/history.html';
        } else {
          alert('❌ Gagal Transaksi: ' + (res.message || 'Terjadi kesalahan sistem'));
          isTransactionLocked = false;
          initSlideToPay();
        }
      } catch (err) {
        alert('❌ Terjadi kesalahan koneksi ke server.');
        isTransactionLocked = false;
        initSlideToPay();
      }
    }

    function formatRupiah(angka) {
      return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(angka);
    }

    function checkOperator(e) {
      var val = e.target.value.replace(/[^0-9]/g, '');
      var detectedOp = null;

      if (val.length >= 4) {
        var prefix = val.substring(0, 4);
        for (var op in prefixes) {
          if (prefixes[op].indexOf(prefix) !== -1) {
            detectedOp = op;
            break;
          }
        }
      }

      if (detectedOp) {
        badge.innerText = detectedOp;
        badge.style.display = 'inline-block';

        if (currentOperator !== detectedOp) {
          currentOperator = detectedOp;
          loadKategoriByOperator(detectedOp);
        }
      } else {
        badge.style.display = 'none';
        stateIcon.className = "fa-solid fa-sim-card";
        emptyText.innerHTML = "Silakan masukkan nomor telepon<br>untuk melihat pilihan pulsa";
        emptyState.style.display = 'flex';
        contentArea.style.display = 'none';
        currentOperator = null;
      }
    }

    inputPhone.addEventListener('input', checkOperator);
    inputPhone.addEventListener('change', checkOperator);
  </script>
</body>
