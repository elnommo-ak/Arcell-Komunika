<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Arcell Komunika - Paket Data XL</title>
  <!-- Font Awesome & Google Font -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      /* Clean White Neumorphism Theme */
      --bg-base: #e6eaf0;
      --neu-light: #ffffff;
      --neu-dark: #babecc;
      --text-main: #4a5568;
      --text-muted: #8c98a9;
      --accent-purple: #7052ff;
      --accent-green: #10b981;
      --border-radius-sm: 14px;
      --border-radius-md: 22px;
      --border-radius-pill: 50px;
      --main-gap: 16px;
      
      --neu-shadow-flat: 6px 6px 12px var(--neu-dark), -6px -6px 12px var(--neu-light);
      --neu-shadow-sm: 3px 3px 6px var(--neu-dark), -3px -3px 6px var(--neu-light);
      --neu-shadow-inset: inset 3px 3px 6px var(--neu-dark), inset -3px -3px 6px var(--neu-light);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Poppins', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    ::-webkit-scrollbar { display: none !important; width: 0 !important; height: 0 !important; }
    * { -ms-overflow-style: none !important; scrollbar-width: none !important; }

    body {
      background-color: var(--bg-base);
      min-height: 100vh;
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: flex-start;
      overflow-x: hidden;
      overflow-y: auto;
    }

    body.no-scroll { overflow: hidden !important; }

    .app-container {
      width: 100%;
      max-width: 480px;
      min-height: 100vh;
      background-color: var(--bg-base);
      position: relative;
      margin: 0 auto;
      padding-bottom: 24px;
    }

    /* Input Box & Wrapper */
    .card-wrapper {
      position: relative;
      z-index: 101;
      padding: 16px 16px 0 16px;
    }

    .card-container {
      display: flex;
      flex-direction: column;
      gap: var(--main-gap);
    }

    .input-box {
      display: flex;
      align-items: center;
      padding: 10px 18px;
      gap: 12px; 
      background: var(--bg-base);
      border-radius: var(--border-radius-pill);
      box-shadow: var(--neu-shadow-inset);
      transition: all 0.25s;
    }

    .input-icon-left {
      color: var(--accent-purple);
      font-size: 0.9rem; 
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: var(--bg-base);
      box-shadow: var(--neu-shadow-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .input-box input {
      flex: 1;
      border: none;
      background: transparent;
      outline: none; 
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--text-main);
      width: 100%;
      letter-spacing: 0.5px;
    }

    .input-box input::placeholder {
      color: var(--text-muted);
      font-weight: 500;
      font-size: 0.85rem;
      opacity: 0.8;
    }

    .operator-badge {
      background: var(--bg-base);
      color: var(--accent-purple);
      box-shadow: var(--neu-shadow-sm);
      padding: 4px 12px;
      border-radius: var(--border-radius-pill);
      font-size: 0.65rem;
      font-weight: 800;
      display: none;
      text-transform: uppercase;
      flex-shrink: 0;
      letter-spacing: 0.5px;
    }

    /* Container Hasil Produk Top Popup */
    .popup-top-container {
      display: none;
      margin-top: 14px;
      padding: 14px;
      background: var(--bg-base);
      border-radius: var(--border-radius-md);
      box-shadow: var(--neu-shadow-inset);
      animation: dropUpAnimation 0.3s ease-out forwards;
    }

    @keyframes dropUpAnimation {
      0% { opacity: 0; transform: translateY(15px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    /* Inset Tabs Kategori */
    .inset-tabs-wrapper {
      display: none;
      overflow-x: auto;
      white-space: nowrap;
      gap: 10px;
      padding: 4px 2px 12px 2px;
      scroll-behavior: smooth;
      width: 100%;
    }

    .tab-item-inset {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 8px 18px;
      border-radius: var(--border-radius-pill);
      border: none;
      background: var(--bg-base);
      color: var(--text-muted);
      font-size: 0.72rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
      flex-shrink: 0;
      box-shadow: var(--neu-shadow-sm);
    }

    .tab-item-inset.active {
      color: var(--accent-purple);
      box-shadow: var(--neu-shadow-inset);
    }

    /* Empty State & Loader */
    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 30px 20px;
      color: var(--text-muted);
      text-align: center;
    }

    .empty-state i {
      font-size: 1.8rem;
      color: var(--accent-purple);
      margin-bottom: 12px;
    }

    .empty-state p {
      font-size: 0.8rem;
      font-weight: 600;
    }

    /* Product Cards */
    .product-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .product-card {
      background: var(--bg-base);
      border-radius: var(--border-radius-sm);
      padding: 14px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      box-shadow: var(--neu-shadow-sm);
      transition: all 0.2s ease;
      position: relative;
    }

    .product-card:active {
      box-shadow: var(--neu-shadow-inset);
      transform: scale(0.98);
    }

    .product-info {
      flex: 1;
      padding-right: 8px;
    }

    .product-title {
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--text-main);
      line-height: 1.3;
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .product-price {
      font-size: 0.88rem;
      font-weight: 800;
      color: var(--accent-purple);
    }

    .dot-indicator {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      margin-left: 4px;
      vertical-align: middle;
      flex-shrink: 0;
    }
    .dot-digiflazz { background-color: #7052ff; box-shadow: 0 0 6px rgba(112, 82, 255, 0.5); }
    .dot-okeconnect { background-color: #10b981; box-shadow: 0 0 6px rgba(16, 185, 129, 0.5); }

    .product-action {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      color: #ffffff;
      background: var(--accent-purple);
      box-shadow: var(--neu-shadow-sm);
      font-size: 0.8rem;
    }

    /* Filter Hide */
    .filter-container { display: none !important; }

    /* Bottom Sheet Checkout */
    .modal-checkout-backdrop {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(15, 23, 42, 0.4); 
      backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
      z-index: 999 !important; display: none; opacity: 0; 
      transition: opacity 0.25s ease;
    }
    .modal-checkout-backdrop.show { display: block; opacity: 1; }

    .bottom-sheet {
      position: fixed; bottom: -100%; left: 50%; transform: translateX(-50%);
      width: 100%; max-width: 480px; background: var(--bg-base);
      border-top-left-radius: 20px; border-top-right-radius: 20px;
      box-shadow: 0px -8px 25px rgba(0, 0, 0, 0.12); z-index: 1000 !important;
      padding: 12px 18px 24px 18px !important;
      transition: bottom 0.28s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .bottom-sheet.active { bottom: 0; }

    .sheet-drag-handle { width: 36px; height: 4px; background: var(--neu-dark); border-radius: 10px; margin: 0 auto 10px auto; opacity: 0.7; }

    .sheet-summary-box {
      background: var(--bg-base); box-shadow: var(--neu-shadow-inset); border-radius: 14px;
      padding: 10px 14px; margin-bottom: 14px; display: flex; flex-direction: column; gap: 6px;
    }
    .sheet-row { display: flex; justify-content: space-between; align-items: center; font-size: 0.76rem; }
    .sheet-row .label { color: var(--text-muted); font-weight: 600; }
    .sheet-row .val-title { font-weight: 700; color: var(--text-main); text-align: right; max-width: 65%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .sheet-row .val-target { font-weight: 800; color: var(--accent-purple); font-family: monospace; font-size: 0.82rem; }
    .sheet-divider { border: none; border-top: 1px dashed var(--neu-dark); opacity: 0.6; margin: 2px 0; }
    .sheet-row .val-price { font-size: 1rem; font-weight: 800; color: var(--accent-purple); }

    .btn-bayar-now {
      background: var(--accent-purple); color: #ffffff; font-weight: 800; border-radius: var(--border-radius-pill);
      padding: 12px; border: none; width: 100%;
      box-shadow: var(--neu-shadow-sm); font-size: 0.82rem; text-transform: uppercase; letter-spacing: 0.5px; cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 8px; transition: all 0.2s ease;
    }
    .btn-bayar-now:active { box-shadow: var(--neu-shadow-inset); transform: scale(0.98); }
  </style>
</head>
<body>

  <div class="app-container">
    <div class="card-wrapper">
      <div class="card-container">
        <!-- Input Box Single -->
        <div class="input-box">
          <div class="input-icon-left">
            <i class="fa-solid fa-mobile-screen-button"></i>
          </div>
          <input 
            type="tel" 
            id="phoneInput" 
            placeholder="Ketik No. HP / Tujuan..." 
            maxlength="20"
            autocomplete="off"
          />
          <span class="operator-badge" id="operatorBadge"></span>
        </div>

        <!-- Tabs Kategori Inset -->
        <div class="inset-tabs-wrapper" id="insetTabsWrapper"></div>
      </div>

      <!-- Popup Container Produk & State -->
      <div class="popup-top-container" id="popupTopContainer">
        <div class="filter-container">
          <select id="sortFilter" onchange="applyPriceSort()">
            <option value="asc" selected>Harga: Murah ke Mahal</option>
            <option value="desc">Harga: Mahal ke Murah</option>
          </select>
        </div>
        
        <div class="empty-state" id="emptyState">
          <i class="fa-solid fa-sim-card" id="stateIcon"></i>
          <p id="emptyText">Masukkan nomor HP tujuan untuk melihat paket produk.</p>
        </div>

        <div class="product-list" id="productList"></div>
      </div>
    </div>
  </div>

  <!-- Bottom Sheet Checkout Modal -->
  <div id="checkoutBackdrop" class="modal-checkout-backdrop" onclick="tutupCheckoutSheet()"></div>
  <div id="checkoutBottomSheet" class="bottom-sheet">
    <div class="sheet-drag-handle"></div>
    
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
      <span style="font-size: 0.85rem; font-weight: 800; color: var(--text-main);" id="sheet_provider_title">Konfirmasi Pembelian</span>
      <button type="button" onclick="tutupCheckoutSheet()" style="background: none; border: none; font-size: 1.1rem; color: var(--text-muted); cursor: pointer; padding: 0 4px;">&times;</button>
    </div>

    <div class="sheet-summary-box">
      <div class="sheet-row">
        <span class="label">Produk</span>
        <span class="val-title" id="sheet_nama_produk">-</span>
      </div>
      <div class="sheet-row">
        <span class="label">Jalur Server</span>
        <span class="val-title" id="sheet_provider_label" style="text-transform: uppercase;">-</span>
      </div>
      <div class="sheet-row">
        <span class="label">No. Tujuan</span>
        <span class="val-target" id="sheet_no_tujuan">-</span>
      </div>
      <div class="sheet-divider"></div>
      <div class="sheet-row">
        <span class="label" style="font-weight: 700; color: var(--text-main);">Total</span>
        <span class="val-price" id="sheet_total_harga">Rp 0</span>
      </div>
    </div>

    <button id="btnProsesBayar" onclick="eksekusiCheckoutTerpilih()" class="btn-bayar-now">
      <i class="fa-solid fa-shield-halved"></i> Bayar Sekarang
    </button>
  </div>

  <script>
    let memberSaldoAktif = 0;
    let selectedCategory = '';
    let dataCheckoutAktif = {};
    let currentOperator = null;
    let groupedProducts = {};

    const prefixes = {
      TELKOMSEL: ['0811', '0812', '0813', '0821', '0822', '0823', '0851', '0852', '0853'],
      INDOSAT: ['0814', '0815', '0816', '0855', '0856', '0857', '0858'],
      XL: ['0817', '0818', '0819', '0859', '0877', '0878'],
      AXIS: ['0831', '0832', '0833', '0838'],
      TRI: ['0895', '0896', '0897', '0898', '0899'],
      SMARTFREN: ['0881', '0882', '0883', '0884', '0885', '0886', '0887', '0888', '0889']
    };

    const phoneInput = document.getElementById('phoneInput');
    const badge = document.getElementById('operatorBadge');
    const popupTopContainer = document.getElementById('popupTopContainer');
    const emptyState = document.getElementById('emptyState');
    const emptyText = document.getElementById('emptyText');
    const stateIcon = document.getElementById('stateIcon');
    const insetTabsWrapper = document.getElementById('insetTabsWrapper');
    const productList = document.getElementById('productList');
    const sortFilter = document.getElementById('sortFilter');

    function formatPhoneNumber(val) {
      let cleaned = val.replace(/[^0-9+]/g, '');
      if (cleaned.startsWith('+62')) cleaned = '0' + cleaned.substring(3);
      else if (cleaned.startsWith('62')) cleaned = '0' + cleaned.substring(2);
      else cleaned = cleaned.replace(/[^0-9]/g, '');
      let match = cleaned.match(/.{1,4}/g);
      return match ? match.join(' ') : cleaned;
    }

    // Load Saldo Member
    async function loadSaldoMemberAkun() {
      const userPhone = localStorage.getItem('userPhone') || localStorage.getItem('user_hp');
      if (!userPhone) return;

      try {
        const res = await fetch('/api/admin/members?t=' + Date.now());
        const result = await res.json();
        const listMember = Array.isArray(result) ? result : (result.data || []);
        const currentMember = listMember.find(m => String(m.phone || m.nohp || '').trim() === String(userPhone).trim());

        if (currentMember) {
          memberSaldoAktif = parseFloat(currentMember.balance || 0);
        }
      } catch (err) {
        console.error("Gagal sinkron saldo member:", err);
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      loadSaldoMemberAkun();
    });

    // Event Listener Input Nomor Tujuan (Dukungan Posisi Kursor Presisi)
    phoneInput.addEventListener('input', (e) => {
      let inputEl = e.target;
      let originalValue = inputEl.value;
      let cursorPos = inputEl.selectionStart;

      let digitsBeforeCursor = originalValue.substring(0, cursorPos).replace(/[^0-9]/g, '').length;
      let formattedVal = formatPhoneNumber(originalValue);
      inputEl.value = formattedVal;

      let newCursorPos = 0;
      let digitCount = 0;

      for (let i = 0; i < formattedVal.length; i++) {
        if (/[0-9]/.test(formattedVal[i])) {
          digitCount++;
        }
        if (digitCount === digitsBeforeCursor) {
          newCursorPos = i + 1;
          break;
        }
      }

      if (digitsBeforeCursor === 0) newCursorPos = 0;
      inputEl.setSelectionRange(newCursorPos, newCursorPos);

      // Logika Deteksi Operator
      let rawDigits = formattedVal.replace(/[^0-9]/g, '');
      let detectedOp = null;

      if (rawDigits.length >= 4) {
        let prefix = rawDigits.substring(0, 4);
        for (let op in prefixes) {
          if (prefixes[op].indexOf(prefix) !== -1) { 
            detectedOp = op; 
            break; 
          }
        }
      }

      if (detectedOp) {
        badge.innerText = detectedOp;
        badge.style.display = 'inline-block';
        if (currentOperator !== detectedOp) {
          currentOperator = detectedOp;
          loadCustomCategoryProducts(detectedOp);
        }
      } else {
        badge.style.display = 'none';
        insetTabsWrapper.style.display = 'none';
        popupTopContainer.style.display = 'block';
        emptyState.style.display = 'flex';
        stateIcon.className = "fa-solid fa-sim-card";
        emptyText.innerText = "Masukkan nomor HP tujuan untuk melihat paket produk.";
        productList.style.display = 'none';
        currentOperator = null;
      }
    });

    // Fetch Produk via Backend API
    async function loadCustomCategoryProducts(brand) {
      emptyState.style.display = 'flex';
      stateIcon.className = "fa-solid fa-spinner fa-spin";
      emptyText.innerText = "Memuat paket kustom...";
      popupTopContainer.style.display = 'block';
      insetTabsWrapper.style.display = 'none';
      productList.style.display = 'none';

      try {
        const res = await fetch(`/api/user/products-by-prefix?brand=${brand}&t=` + Date.now());
        const result = await res.json();

        if (result.status === 'success' && result.data && Object.keys(result.data).length > 0) {
          groupedProducts = result.data;
          renderTabs(Object.keys(groupedProducts));
        } else {
          emptyState.style.display = 'flex';
          stateIcon.className = "fa-solid fa-box-open";
          emptyText.innerHTML = `Belum ada folder kustom untuk <b>${brand}</b>.`;
          popupTopContainer.style.display = 'block';
          insetTabsWrapper.style.display = 'none';
          productList.style.display = 'none';
        }
      } catch (err) {
        console.error("Gagal load custom categories:", err);
        emptyState.style.display = 'flex';
        stateIcon.className = "fa-solid fa-triangle-exclamation";
        emptyText.innerText = "Gagal terhubung ke server.";
      }
    }

    function renderTabs(categoriesArray) {
      let html = "";
      categoriesArray.forEach((cat, index) => {
        html += `<button class="tab-item-inset ${index === 0 ? 'active' : ''}" onclick="selectCategory(this, '${cat}')">${cat}</button>`;
      });
      insetTabsWrapper.innerHTML = html;
      insetTabsWrapper.style.display = 'flex';
      emptyState.style.display = 'none';
      productList.style.display = 'flex';
      popupTopContainer.style.display = 'block';

      if (categoriesArray.length > 0) selectCategory(insetTabsWrapper.children[0], categoriesArray[0]);
    }

    window.selectCategory = function(element, categoryName) {
      document.querySelectorAll('#insetTabsWrapper .tab-item-inset').forEach(el => el.classList.remove('active'));
      if (element) element.classList.add('active');
      selectedCategory = categoryName;
      applyPriceSort();
    }

    window.applyPriceSort = function() {
      let rawList = groupedProducts[selectedCategory] || [];

      if (rawList.length === 0) {
        productList.innerHTML = `<div style="text-align:center; padding: 20px; font-size: 0.8rem; color: var(--text-muted);">Tidak ada produk pada kategori ini.</div>`;
        return;
      }

      let sortValue = sortFilter ? sortFilter.value : 'asc';
      let sortedProducts = [...rawList];
      sortedProducts.sort((a, b) => {
        let priceA = parseFloat(a.jual || a.price || a.harga || 0);
        let priceB = parseFloat(b.jual || b.price || b.harga || 0);
        return sortValue === 'asc' ? priceA - priceB : priceB - priceA;
      });

      let html = "";
      sortedProducts.forEach((prod) => {
        let harga = prod.jual || prod.price || prod.harga || 0;
        let hargaFormatted = new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(harga);
        let namaProduk = prod.product_name || prod.nama_produk || prod.nama || 'Produk';
        let skuProduk = prod.buyer_sku_code || prod.code || prod.sku || prod.kode || '';
        let prov = prod._provider || prod.provider || 'digiflazz';

        let dotHtml = prov === 'okeconnect' 
          ? `<span class="dot-indicator dot-okeconnect"></span>`
          : `<span class="dot-indicator dot-digiflazz"></span>`;

        let namaClean = String(namaProduk).replace(/'/g, "\\'").replace(/"/g, '\\"');
        let skuClean = String(skuProduk).replace(/'/g, "\\'").replace(/"/g, '\\"');

        html += `
          <div class="product-card" onclick="prosesBeli('${prov}', '${skuClean}', '${namaClean}', ${harga})">
            <div class="product-info">
              <div class="product-title">${namaProduk} ${dotHtml}</div>
              <div class="product-price">${hargaFormatted}</div>
            </div>
            <div class="product-action"><i class="fa-solid fa-chevron-right"></i></div>
          </div>
        `;
      });
      productList.innerHTML = html;
    }

    // Proses Checkout Modal Bottom Sheet
    window.prosesBeli = function(provider, skuCode, productName, price) {
      let nomorTujuan = phoneInput.value.replace(/[^0-9]/g, '');

      if (nomorTujuan.length < 10 || nomorTujuan.length > 13) {
        alert('❌ Nomor HP tidak valid! Masukkan nomor tujuan minimal 10-13 digit.');
        phoneInput.focus();
        return;
      }

      if (memberSaldoAktif < price) {
        return alert(`❌ Saldo Anda Tidak Mencukupi!\n\nHarga Produk: Rp ${price.toLocaleString('id-ID')}\nSaldo Anda: Rp ${memberSaldoAktif.toLocaleString('id-ID')}`);
      }

      dataCheckoutAktif = {
        provider: provider,
        buyer_sku_code: skuCode,
        product_name: productName,
        customer_no: nomorTujuan,
        price: price,
        ref_id: 'TRX-' + Date.now()
      };

      document.getElementById('sheet_provider_title').innerText = "Konfirmasi Pembelian";
      document.getElementById('sheet_provider_label').innerText = provider;
      document.getElementById('sheet_nama_produk').innerText = productName;
      document.getElementById('sheet_no_tujuan').innerText = nomorTujuan;
      document.getElementById('sheet_total_harga').innerText = new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(price);

      const backdrop = document.getElementById('checkoutBackdrop');
      const sheet = document.getElementById('checkoutBottomSheet');

      document.body.classList.add('no-scroll');
      backdrop.classList.add('show');
      setTimeout(() => { sheet.classList.add('active'); }, 10);
    };

    function tutupCheckoutSheet() {
      const backdrop = document.getElementById('checkoutBackdrop');
      const sheet = document.getElementById('checkoutBottomSheet');
      sheet.classList.remove('active');
      setTimeout(() => { 
        backdrop.classList.remove('show'); 
        document.body.classList.remove('no-scroll');
      }, 300);
    }

    // Eksekusi Transaksi
    async function eksekusiCheckoutTerpilih() {
      const btn = document.getElementById('btnProsesBayar');
      btn.disabled = true;
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Memproses...';

      const userHp = localStorage.getItem('userPhone') || localStorage.getItem('user_hp') || dataCheckoutAktif.customer_no;
      const userName = localStorage.getItem('userName') || localStorage.getItem('username') || 'Member';
      const subId = localStorage.getItem('onesignal_subscription_id') || '';

      const payload = {
        buyer_sku_code: dataCheckoutAktif.buyer_sku_code,
        customer_no: dataCheckoutAktif.customer_no,
        user_hp: userHp,
        username: userName,
        nama_produk: dataCheckoutAktif.product_name,
        harga_jual: dataCheckoutAktif.price,
        subscription_id: subId
      };

      const endpointUrl = dataCheckoutAktif.provider === 'okeconnect' ? '/api/okeconnect/checkout' : '/api/digiflazz/checkout';

      try {
        const response = await fetch(endpointUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const res = await response.json();

        if (res.status === 'success' || res.status === 200) {
          tutupCheckoutSheet();
          var refIdResult = (res.data && (res.data.ref_id || res.data.id || res.data.trx_id)) 
                            ? (res.data.ref_id || res.data.id || res.data.trx_id) 
                            : (res.ref_id || dataCheckoutAktif.ref_id);

          window.location.href = 'detail.html?id=' + encodeURIComponent(refIdResult);
        } else {
          alert('❌ Gagal Transaksi: ' + (res.message || 'Terjadi kesalahan'));
          btn.disabled = false;
          btn.innerHTML = '<i class="fa-solid fa-shield-halved"></i> Bayar Sekarang';
        }
      } catch (err) {
        console.error(err);
        alert('❌ Gagal terhubung ke Server');
        btn.disabled = false;
        btn.innerHTML = '<i class="fa-solid fa-shield-halved"></i> Bayar Sekarang';
      }
    }
  </script>
</body>
</html>
